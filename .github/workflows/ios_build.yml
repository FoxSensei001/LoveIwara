name: Build iOS IPA (Unsigned)

on:
  workflow_dispatch: 

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Tải các thư viện phụ thuộc (Dependencies)
        run: flutter pub get

      - name: Cài đặt CocoaPods (Thư viện iOS)
        run: |
          cd ios
          pod install
          cd ..

      - name: Vô hiệu hóa Code Signing triệt để (Bằng Ruby Script)
        run: |
          sudo gem install xcodeproj
          cat <<EOF > disable_signing.rb
          require 'xcodeproj'
          
          # Tắt signing cho Project chính
          project_path = 'ios/Runner.xcodeproj'
          project = Xcodeproj::Project.open(project_path)
          project.targets.each do |target|
            target.build_configurations.each do |config|
              config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
              config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
              config.build_settings['CODE_SIGN_IDENTITY'] = ''
              config.build_settings['EXPANDED_CODE_SIGN_IDENTITY'] = ''
              # Ép chế độ ký duyệt về thủ công để Xcode không tự tìm kiếm chứng chỉ
              config.build_settings['CODE_SIGN_STYLE'] = 'Manual'
              config.build_settings.delete('DEVELOPMENT_TEAM')
              config.build_settings.delete('PROVISIONING_PROFILE_SPECIFIER')
            end
          end
          project.save
          
          # Tắt signing cho tất cả các thư viện phụ thuộc (Pods)
          pod_project_path = 'ios/Pods/Pods.xcodeproj'
          if File.exist?(pod_project_path)
            pod_project = Xcodeproj::Project.open(pod_project_path)
            pod_project.targets.each do |target|
              target.build_configurations.each do |config|
                config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
                config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
                config.build_settings['CODE_SIGN_IDENTITY'] = ''
              end
            end
            pod_project.save
          end
          EOF
          ruby disable_signing.rb

      - name: Build file ứng dụng iOS
        run: flutter build ios --release --no-codesign

      - name: Đóng gói thành định dạng file .ipa
        run: |
          mkdir -p Payload
          mv build/ios/iphoneos/Runner.app Payload/
          zip -r -9 LoveIwara.ipa Payload/

      - name: Xuất file để tải về
        uses: actions/upload-artifact@v4
        with:
          name: LoveIwara-iOS-App
          path: LoveIwara.ipa
