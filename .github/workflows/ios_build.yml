name: Build iOS IPA (Unsigned)

on:
  workflow_dispatch: 

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Tải Dependencies
        run: flutter pub get

      - name: Tiêm mã chặn Signing vào Podfile có sẵn
        run: |
          # Dùng Ruby để tìm dòng lệnh của Flutter và chèn mã tắt Signing vào ngay bên dưới nó mà không gây trùng lặp post_install
          ruby -i -pe 'gsub(/flutter_additional_ios_build_settings\(target\)/, "flutter_additional_ios_build_settings(target)\n      target.build_configurations.each do |config|\n        config.build_settings[\"CODE_SIGNING_ALLOWED\"] = \"NO\"\n        config.build_settings[\"CODE_SIGNING_REQUIRED\"] = \"NO\"\n        config.build_settings[\"CODE_SIGN_IDENTITY\"] = \"\"\n      end")' ios/Podfile

      - name: Biên dịch iOS bằng lệnh Native Xcode (Ép tắt Signing)
        run: |
          cd ios
          pod install
          # Gọi trực tiếp công cụ xcodebuild của Apple
          xcodebuild clean build \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED="NO" \
            CODE_SIGNING_REQUIRED="NO" \
            CODE_SIGN_IDENTITY="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            SYMROOT="$(PWD)/build"

      - name: Đóng gói thành định dạng file .ipa
        run: |
          mkdir -p Payload
          # xcodebuild lưu file vào thư mục Release-iphoneos
          mv ios/build/Release-iphoneos/Runner.app Payload/
          zip -r -9 LoveIwara.ipa Payload/

      - name: Xuất file để tải về
        uses: actions/upload-artifact@v4
        with:
          name: LoveIwara-iOS-App
          path: LoveIwara.ipa
