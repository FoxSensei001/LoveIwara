name: Build iOS IPA (Unsigned)

on:
  workflow_dispatch: 

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Tải các thư viện phụ thuộc (Dependencies)
        run: flutter pub get

      - name: Triệt tiêu Code Signing từ gốc cấu hình (Force Disable)
        run: |
          # Ghi đè lệnh cấm ký duyệt vào file cấu hình lõi của Flutter
          echo "CODE_SIGNING_ALLOWED=NO" >> ios/Flutter/Release.xcconfig
          echo "CODE_SIGNING_REQUIRED=NO" >> ios/Flutter/Release.xcconfig
          echo "CODE_SIGN_IDENTITY=" >> ios/Flutter/Release.xcconfig
          echo "EXPANDED_CODE_SIGN_IDENTITY=" >> ios/Flutter/Release.xcconfig
          
          # Xóa các tàn dư Team ID cũ của tác giả
          sed -i '' '/DEVELOPMENT_TEAM/d' ios/Runner.xcodeproj/project.pbxproj || true
          sed -i '' '/PROVISIONING_PROFILE_SPECIFIER/d' ios/Runner.xcodeproj/project.pbxproj || true

      - name: Build file ứng dụng iOS
        run: flutter build ios --release --no-codesign

      - name: Đóng gói thành định dạng file .ipa
        run: |
          mkdir -p Payload
          mv build/ios/iphoneos/Runner.app Payload/
          zip -r -9 LoveIwara.ipa Payload/

      - name: Xuất file để tải về
        uses: actions/upload-artifact@v4
        with:
          name: LoveIwara-iOS-App
          path: LoveIwara.ipa
