name: Build iOS IPA (Unsigned)

on:
  workflow_dispatch: 

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Tải Dependencies
        run: flutter pub get

      - name: Tiêm mã chặn Signing vào các thư viện (Podfile)
        run: |
          echo "
          post_install do |installer|
            installer.pods_project.targets.each do |target|
              target.build_configurations.each do |config|
                config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
                config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
                config.build_settings['CODE_SIGN_IDENTITY'] = ''
              end
            end
          end" >> ios/Podfile

      - name: Biên dịch iOS bằng lệnh Native Xcode (Ép tắt Signing)
        run: |
          cd ios
          pod install
          # Gọi trực tiếp công cụ xcodebuild của Apple thay vì qua Flutter
          xcodebuild clean build \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED="NO" \
            CODE_SIGNING_REQUIRED="NO" \
            CODE_SIGN_IDENTITY="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            SYMROOT="$(PWD)/build"

      - name: Đóng gói thành định dạng file .ipa
        run: |
          mkdir -p Payload
          # xcodebuild lưu file vào thư mục Release-iphoneos
          mv ios/build/Release-iphoneos/Runner.app Payload/
          zip -r -9 LoveIwara.ipa Payload/

      - name: Xuất file để tải về
        uses: actions/upload-artifact@v4
        with:
          name: LoveIwara-iOS-App
          path: LoveIwara.ipa
