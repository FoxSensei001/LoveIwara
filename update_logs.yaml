        - "Improved layouts and interactions for common lists and detail pages"
        - "Fixed crashes on some devices caused by incorrect Impeller configuration"
        - "Removed Windows zip build artifacts; now using installer only, fixing video playback freeze issues"
        - "Other optimizations and bug fixes"
