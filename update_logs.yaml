        - "优化常用列表、详情页的布局和交互"
        - "修复部分机型因 Impeller 配置错误导致的闪退问题"
        - "Windows 版本移除 zip 构建产物，统一使用安装器进行安装，解决视频播放卡死问题"
        - "其他优化和错误修复"
      en:
