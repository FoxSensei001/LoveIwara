# 最新版本
#
# ⭐ 热修（semver 不变、只重新打包）必须把 build 号一起写上，例如 "0.5.1+4"。
#    客户端从 2026-09-11 起会比较 build 号（见 lib/utils/app_version.dart）：
#    这里只写 "0.5.1" 的话 build 视为 0，所有装着 0.5.1+N 的用户都看不到这次热修。
#    正常的版本升级（0.5.1 → 0.5.2）不写 build 号也能正常检出。
currentVersion: "0.7.0"
# 更新日志
# 格式介绍
# 1. version: 版本号
# 2. date: 更新日期
# 3. changes: 更新内容
#
# ⛔ minVersion（最小版本号）已废弃，新条目不要再写。
#    它过去只是在更新弹窗里多显示一行红字，用户照样能「取消」、甚至能点
#    「忽略此版本」把它永久静音——没有任何强制力。留着一个没有效力的
#    "强制更新"比没有更糟，所以 2026-09-11 把这个概念整只删掉了
#    （UpdateInfo.minVersion 与 VersionService.needMinVersionUpdate 都已移除）。
#    下面历史条目里残留的 minVersion 字段保留不动：删掉它对已发布的旧版客户端
#    没有区别（它们读不到就按 '0.0.1' 兜底），但改动 21 条历史记录纯属噪音。
updates:
  - version: "0.7.0"
    date: "2026-10-31"
    changes:
      zh-CN:
        - "AI 升为独立的设置分区：可添加多家供应商、一家挂多个模型，翻译、搜索、小尾巴各自指定用哪个模型；内置 50 多家供应商的地址与模型目录（随线上热更新），填好密钥即可拉取模型并试用；密钥加密保存，不进配置备份"
        - "新增「用一句话搜」：用大白话描述想看的内容，AI 帮你选好板块、关键词、排序与筛选，并先替你试搜确认有结果；思考过程全程可见，最后由你自己按下搜索"
        - "搜索更准：Iwara 的关键词搜索本身不搜标签，现在会自动认出关键词对应的标签并多路补搜、合并去重，「萝莉」「藿藿」这类词不再只有一两成相关；同一作品的日 / 英 / 中名字也一并补搜"
        - "搜索框下新增「精确匹配」开关（给关键词加引号，结果更少但更准，新装默认关闭）；认出标签时可在同一位置开关「按标签扩展」"
        - "最爱、关注 / 粉丝、播放列表、本地收藏夹、稍后再看与作者页加入列表内搜索：可只搜已加载的部分，也可扫整个列表；匹配标题、作者昵称与 @用户名，多个词需同时命中"
        - "下载设置新增「保存结构与命名」：平铺、按作者（新装默认）、按日期三种预设一键切换，也可在路径模板编辑器里自定义最多三层文件夹；作者改了昵称，新下载仍进原来的文件夹"
        - "下载确认框直接显示「将保存到」的路径；下载完成的提示会说明存进了哪个文件夹，遇到同名改了序号、或因没有权限退回应用目录时也会明说，不再悄悄换位置"
        - "新增 %titletext 命名变量：去掉标题里的表情与特殊符号，解决部分设备外置存储拒收这类文件名的问题（#132）"
        - "可把已下载的文件整体搬到新的下载目录；文件被删或丢失时，下载列表顶部会提示，并可筛出「需处理」的任务、查看原因与处理办法"
        - "下载列表重做：封面就是暂停 / 继续 / 重试按钮并带进度环，已完成的按今天、昨天、本周、本月分组；动效与触感重新调过，完成时原地打勾再落入历史"
        - "安卓下载期间挂前台服务与进度通知，熄屏或切到别的应用后下载不再停（#136）；下载好的视频与图片会进入系统媒体库，相册和其他应用都能选到（#124）"
        - "本机文件接入 NAS（WebDAV）：支持测试连接、信任自签证书、选择根目录，凭据加密保存；NAS 上的视频与图片可直接播放和看图（Quest 头显上也能用），连不上或登录失效时可就地重新登录"
        - "本机文件：卡片显示观看进度，新增「最近播放」排序、首页全库搜索、目录内含子文件夹搜索；条目菜单新增「在文件夹中显示」「文件信息」；来源可重命名，可单独开启扫描「.」开头的隐藏文件夹"
        - "本机文件：安卓上改用系统解码器读取视频信息与封面，大目录建库快很多，也不再卡住界面；文件找不到时给出诊断，可重新扫描、认领改名后的文件或从列表移除"
        - "设备视频：未授予媒体权限时不再把整个设备视频清空，来源卡会提示并可就地授权；修复手动设封面提示「封面保存失败」、自动封面一直不出的问题"
        - "浏览历史重写：统一按「最后浏览」时间排序与分组（今天 / 昨天 / 本周 / 本月 / 按月），单条删除可在提示里撤销；历史可作为「接着看」的视频池；修复「今天」筛选漏掉记录、时间显示差 8 小时的问题"
        - "小尾巴升级为模板：可插入日期、一言、当前视频的标题、作者、标签、楼层、播放进度等变量，在按下发送那一刻生成；填不出的变量连同周围的标点一起消失，一条模板到处通用"
        - "小尾巴可接入一言等数据源（内置 Hitokoto、今日诗词等，也能接自己的接口），或让 AI 照着你正在看的内容现写一句；设置页带案例库与多场景预览，非中文界面可自动把一言译成界面语言"
        - "评论里的引用条显示对方头像与昵称，点一下跳到被引用的楼层；多行小尾巴不再被当成正文，小尾巴里的分隔线也终于能正常显示"
        - "编辑已发布的评论时，引用头与小尾巴作为普通文字整条摊开，可以随意修改；评论框的三个点菜单里常驻小尾巴开关与「编辑小尾巴」；私信不再附带小尾巴"
        - "表情面板重做：顶部是带缩略图的分组选项栏，横滑网格即可换组，并新增「最近使用」"
        - "正文与评论里的投票链接直接显示成可投票的卡片，标题与选项可一键翻译"
        - "支持按标签屏蔽内容：在标签详情里一键屏蔽，或在屏蔽设置里多选标签批量添加"
        - "安卓小窗：按钮失败时会提示原因，不再毫无反应；新增「回桌面自动进小窗」设置（默认关闭），正在播放时回到桌面即自动缩成小窗"
        - "图库大图页加入「接着看」，换下一本时仍停留在大图页"
        - "手机 / 平板看 VR180、VR360 全景时可用重力感应环视：转动设备即可看四周，手指拖动仍可微调；默认关闭，第一次进入环视时会询问一次，之后可在播放器设置或环视底栏随时开关"
        - "HTTP 代理设置改为服务器与端口分开填写，粘贴完整地址会自动拆分，保存前可先测试连接"
        - "界面材质的外观可调（不透明度、背景模糊等），拖动滑块即时生效；弹窗与抽屉里的液态玻璃不再「隐身」"
        - "整页侧滑返回改用各平台的原生手势（iOS 边缘侧滑、安卓预测性返回）"
        - "AI 翻译：修复「没翻成目标语言」「点了没反应」，翻译提示词改为内置、按目标语言生成；翻译失败会显示具体原因；长帖不再被中途截断，流式输出不再频繁刷新界面"
        - "修复视频只剩 360p：官网更换签名后应用会自动更新，不必等新版本（感谢 Sakura-Natsu，#135）"
        - "Windows：点开应用约 0.1 秒就出现启动画面，不再白等两三秒；修复开着液态玻璃时首屏白屏近 20 秒；关窗后声音不再在后台多放几秒"
        - "Windows：修复开着显示器 HDR 时切到别的窗口屏幕变暗；修复评论框被播放器抢走焦点（只能打出英文字母）；VR 环视画面不再上下颠倒"
        - "桌面端：修复侧边栏返回钮与 ESC 提示「再按一次退出」却退不掉；修复在全屏或最大化时关掉、下次窗口开到屏幕外；macOS 标题栏与红绿灯按钮对齐"
        - "Quest：修复手势拖窗时射线乱甩、唤出控制面板时手和射线冻住再跳一下；「接着看」换片后不再残留缓冲转圈"
        - "修复安卓下拉通知栏、小窗失焦时隐私遮罩误盖住屏幕，以及「立即锁定」档被误锁（#123）"
        - "修复从预览弹窗进入详情再返回后卡片变成空白（#125）；设了自定义封面的视频也能出动图预览"
        - "其他修复：本地视频误报「请检查网络」；鼠标滚轮拨不动横向列表；列表最后一行被右下角浮钮挡住；论坛分页模式下编辑回复报错，发完回复会定位到新楼层；oreno3d 匹配被 Cloudflare 拦截；键盘开着时点菜单弹层会下沉一截"
        - "闪退排查：即使没开日志，闪退原因也会被记下，下次启动后导出日志即可一并带上，方便反馈问题"
        - "性能：去掉打开过视频详情后后台一直在跑的高频轮询；列表卡片少推合成层，滚动更顺；空闲时不再满帧重绘，更省电"
      en:
        - "AI is now its own settings section: add several providers, each with several models, and choose which model handles translation, search and signatures. A built-in directory of 50+ providers (updated online) fills in endpoints and models, so you only paste a key, fetch the models and try them. Keys are stored encrypted and never go into config backups"
        - "New 'Search in plain words': describe what you want to watch and AI picks the section, keywords, sort and filters, running a trial search first to make sure it finds something. Its reasoning is visible throughout, and you press Search yourself"
        - "More accurate search: Iwara's keyword search ignores tags, so the app now recognises the tags behind your keywords, searches them in parallel and merges the results. Names of the same work in Japanese, English and Chinese are searched too"
        - "New 'Exact match' toggle under the search box (quotes your keywords: fewer but more precise results; off by default on new installs). When a tag is recognised, the same spot toggles 'Expand by tag'"
        - "In-list search for Likes, Following / Followers, playlists, local favourites, Watch Later and creator pages: search what is loaded, or scan the whole list. Matches title, creator nickname and @username; every word must match"
        - "New 'Folder structure & naming' in download settings: switch between Flat, By creator (default for new installs) and By date, or build up to three folder levels in the path template editor. When a creator changes their nickname, new downloads still go into the original folder"
        - "The download dialog now shows where the file will be saved, and the completion notice says which folder it went to. If a name clash added a number, or missing permission forced a fallback to the app folder, you are told instead of the location changing silently"
        - "New %titletext naming variable: strips emoji and symbols from titles, for external storage on some devices that rejects such file names (#132)"
        - "Move finished downloads to a new download folder. When files are deleted or missing, a banner appears in the download list and a 'Needs attention' filter shows the cause and what to do"
        - "Download list redesigned: the cover is the pause / resume / retry button with a progress ring, and finished items are grouped by today, yesterday, this week and this month. Motion and haptics were retuned, and a finished task ticks in place before moving to history"
        - "On Android, a foreground service with a progress notification keeps downloads running with the screen off or another app open (#136). Downloaded videos and images now appear in the system media library, so galleries and other apps can see them (#124)"
        - "Local Media now connects to NAS (WebDAV): test the connection, trust self-signed certificates, pick a root folder; credentials are stored encrypted. Videos and images on the NAS play and open directly (Quest included), and you can sign in again on the spot when the connection or login fails"
        - "Local Media: cards show watch progress; new 'Recently played' sort, library-wide search and search including subfolders; 'Show in folder' and 'File info' in the item menu; sources can be renamed and can opt in to scanning hidden folders starting with '.'"
        - "Local Media on Android reads video info and covers with the system decoder, so large folders index much faster without freezing the UI. Missing files get a diagnosis with options to rescan, claim a renamed file or remove it"
        - "Device videos: without media permission the whole device-video source is no longer wiped; the source card says so and offers to grant access. Fixed manual covers failing with 'Failed to save cover' and automatic covers never appearing"
        - "History rebuilt: sorted and grouped by last viewed (today / yesterday / this week / this month / by month); a single deletion can be undone from the toast; history can serve as the Up Next pool. Fixed the 'Today' filter missing entries and times showing 8 hours off"
        - "Signatures are now templates: insert variables such as date, hitokoto, the current video's title, creator, tags, floor and playback position, filled in the moment you press Send. A variable that cannot be filled disappears together with its surrounding punctuation, so one template works everywhere"
        - "Signatures can pull from sources such as Hitokoto or Jinrishici (or your own API), or have AI write a line about what you are watching. Settings include a recipe library and multi-scene previews; on non-Chinese interfaces quotes can be translated into the interface language automatically"
        - "Quote bars in comments now show the quoted user's avatar and nickname, and tapping one jumps to that floor. Multi-line signatures are no longer mistaken for the body, and divider lines inside signatures finally render"
        - "Editing a posted comment lays out the whole original text, quote header and signature included, so everything is editable. The comment box's three-dot menu always has the signature toggle and 'Edit signature'. Private messages no longer carry a signature"
        - "Emoji panel redesigned: a group bar with thumbnails at the top, swipe the grid to switch groups, plus a new 'Recent' group"
        - "Poll links in posts and comments now render as cards you can vote on, with one-tap translation of the title and options"
        - "Block content by tag: block from the tag details dialog, or add several tags at once in block settings"
        - "Android picture-in-picture: the PiP button now explains why it failed instead of doing nothing. New 'Auto PiP when going home' setting (off by default) shrinks a playing video into a mini window when you leave the app"
        - "The gallery viewer gains Up Next; switching to the next gallery keeps you in the viewer"
        - "On phones and tablets, VR180 / VR360 panoramas can follow the device's motion sensors: turn the device to look around, and drag to fine-tune. Off by default; you are asked once the first time you enter panorama view, and it can be toggled in player settings or from the panorama toolbar"
        - "HTTP proxy settings now take server and port separately; pasting a full address splits it automatically, and you can test the connection before saving"
        - "The glass appearance is adjustable (opacity, background blur and more) and updates live as you drag; liquid glass inside dialogs and drawers is no longer invisible"
        - "Full-page swipe back now uses each platform's native gesture (iOS edge swipe, Android predictive back)"
        - "AI translation: fixed text not being translated into the target language or nothing happening, by building the prompt in-app for the target language. Failures show the actual cause, long posts are no longer cut off halfway, and streaming no longer refreshes the UI constantly"
        - "Fixed videos only offering 360p: when the site changes its signing, the app now updates itself without waiting for a new release (thanks to Sakura-Natsu, #135)"
        - "Windows: a splash screen appears about 0.1 s after launch instead of two to three seconds of nothing; fixed a nearly 20-second white screen with liquid glass on; audio no longer keeps playing for a few seconds after closing the window"
        - "Windows: fixed the screen dimming when switching to another window with monitor HDR on; fixed the player stealing focus from the comment box (only Latin letters could be typed); VR panoramas are no longer upside down"
        - "Desktop: fixed the sidebar back button and Esc showing 'press again to exit' but never exiting; fixed the window opening off-screen after closing it in fullscreen or maximised; the macOS title bar now lines up with the traffic-light buttons"
        - "Quest: fixed the ray swinging wildly while dragging windows by hand, and hands and rays freezing then jumping when summoning the control panel; switching videos via Up Next no longer leaves a buffering spinner behind"
        - "Fixed the privacy cover appearing over the screen on Android when pulling down the notification shade or when the mini window lost focus, and 'Lock immediately' locking in those cases (#123)"
        - "Fixed cards turning blank after opening details from the preview dialog and coming back (#125); videos with a custom cover now show animated previews too"
        - "Other fixes: local videos wrongly warning 'check your network'; the mouse wheel not scrolling horizontal lists; the last row of lists hidden behind the corner buttons; editing replies failing in forum pagination mode, and new replies now scroll into view; oreno3d matching blocked by Cloudflare; sheets dropping when opening a menu with the keyboard up"
        - "Crash diagnostics: the cause of a crash is recorded even with logging off, and included the next time you export logs, making bug reports easier"
        - "Performance: removed high-frequency polling that kept running after opening any video page; list cards push fewer compositing layers for smoother scrolling; the app no longer redraws every frame while idle, saving battery"
      ja:
        - "AI が独立した設定項目になりました：複数のプロバイダーを登録でき、1 社に複数モデルを設定可能。翻訳・検索・署名ごとに使うモデルを選べます。50 社以上のプロバイダーと接続先・モデル一覧を内蔵（オンラインで更新）しており、キーを入れるだけでモデル取得と試用ができます。キーは暗号化して保存され、設定バックアップには含まれません"
        - "「ひとことで検索」を追加：見たい内容を普段の言葉で伝えると、AI がセクション・キーワード・並び順・フィルターを選び、結果が出るか試し検索してから提案します。思考過程はすべて表示され、検索ボタンは自分で押します"
        - "検索精度が向上：Iwara のキーワード検索はタグを対象にしないため、キーワードに対応するタグを自動で見つけて並行検索し、結果を重複なくまとめます。同じ作品の日本語・英語・中国語名も合わせて検索します"
        - "検索ボックスの下に「完全一致」スイッチを追加（キーワードを引用符で囲み、件数は減るが精度が上がる。新規インストールでは既定でオフ）。タグを認識したときは同じ位置で「タグで拡張」を切り替えられます"
        - "お気に入り・フォロー / フォロワー・プレイリスト・ローカルのお気に入りフォルダ・後で見る・作者ページにリスト内検索を追加：読み込み済みの範囲だけでもリスト全体でも検索でき、タイトル・作者のニックネーム・@ユーザー名に一致します（複数語はすべて一致が必要）"
        - "ダウンロード設定に「保存構成と命名」を追加：フラット・作者別（新規インストールの既定）・日付別をワンタップで切り替え、パステンプレートエディターで最大 3 階層のフォルダを自由に組めます。作者がニックネームを変えても、新しいダウンロードは元のフォルダに入ります"
        - "ダウンロード確認ダイアログに保存先を表示。完了通知ではどのフォルダに保存したかを示し、同名ファイルで番号を付けたときや権限がなくアプリ用フォルダに保存したときもはっきり伝えます"
        - "命名変数 %titletext を追加：タイトルから絵文字や記号を取り除き、こうしたファイル名を受け付けない一部端末の外部ストレージでも保存できるようにします（#132）"
        - "ダウンロード済みファイルを新しいダウンロード先へまとめて移動できるようになりました。ファイルが削除・紛失した場合はダウンロード一覧の上部に表示され、「要対応」で絞り込んで原因と対処を確認できます"
        - "ダウンロード一覧を刷新：カバーが一時停止 / 再開 / 再試行ボタンを兼ね、進捗リングを表示。完了分は今日・昨日・今週・今月でグループ化。アニメーションと触覚を調整し、完了時はその場でチェックが付いてから履歴に移ります"
        - "Android ではダウンロード中にフォアグラウンドサービスと進捗通知を表示し、画面オフや他アプリへの切り替えでも止まらなくなりました（#136）。保存した動画と画像はシステムのメディアライブラリに登録され、ギャラリーや他のアプリから選べます（#124）"
        - "ローカルファイルが NAS（WebDAV）に対応：接続テスト、自己署名証明書の信頼、ルートフォルダの選択が可能で、認証情報は暗号化して保存。NAS 上の動画と画像をそのまま再生・閲覧でき（Quest でも利用可）、接続やログインに失敗したらその場で再ログインできます"
        - "ローカルファイル：カードに視聴進捗を表示。「最近再生」の並び替え、ライブラリ全体の検索、サブフォルダを含む検索を追加。項目メニューに「フォルダで表示」「ファイル情報」を追加し、ソース名の変更や「.」で始まる隠しフォルダのスキャンも選べます"
        - "ローカルファイル：Android ではシステムのデコーダーで動画情報とカバーを取得するようになり、大きなフォルダの登録が大幅に速く、画面も固まりません。見つからないファイルには診断を表示し、再スキャン・名前変更後のファイルの引き継ぎ・一覧からの削除を選べます"
        - "端末の動画：メディア権限がないときに端末動画がすべて消えてしまう問題を修正し、ソースカードで案内してその場で許可できるようにしました。手動カバーが「カバーの保存に失敗」になる、自動カバーが出ない問題も修正"
        - "閲覧履歴を作り直し：「最後に見た日時」で並べ、今日 / 昨日 / 今週 / 今月 / 月別にグループ化。1 件の削除は通知から取り消せます。履歴を「続けて見る」の動画プールとして使えます。「今日」の絞り込みで漏れが出る、時刻が 8 時間ずれる問題を修正"
        - "署名がテンプレートに：日付・一言・視聴中の動画のタイトル・作者・タグ・階数・再生位置などの変数を挿入でき、送信ボタンを押した瞬間に値が入ります。値が取れない変数は周りの記号ごと消えるので、ひとつのテンプレートをどこでも使えます"
        - "署名に一言などのデータソース（Hitokoto・今日詩詞などを内蔵、独自 API も可）をつなげるほか、AI に今見ている内容に合わせた一言を書かせることもできます。設定にはサンプル集と複数シーンのプレビューがあり、中国語以外の表示言語では一言を自動翻訳できます"
        - "コメントの引用バーに相手のアイコンとニックネームを表示し、タップで引用先の階へジャンプします。複数行の署名が本文と誤認されなくなり、署名内の区切り線も正しく表示されます"
        - "投稿済みコメントの編集時は、引用ヘッダーと署名を含む原文全体を普通の文字として表示し、自由に直せます。コメント欄の三点メニューには署名のオン / オフと「署名を編集」を常に表示。DM には署名を付けなくなりました"
        - "絵文字パネルを刷新：上部にサムネイル付きのグループバー、グリッドを横スワイプでグループ切り替え、「最近使ったもの」を追加"
        - "本文やコメント内の投票リンクをその場で投票できるカードとして表示し、タイトルと選択肢をワンタップで翻訳できます"
        - "タグでコンテンツをブロック：タグ詳細からワンタップで、またはブロック設定で複数のタグをまとめて追加できます"
        - "Android のピクチャーインピクチャー：ボタンが失敗したときは理由を表示するようにしました。新設定「ホームに戻ると自動で小窓」（既定でオフ）をオンにすると、再生中にホームへ戻ったとき自動で小窓になります"
        - "ギャラリーの拡大表示に「続けて見る」を追加。次のギャラリーに切り替えても拡大表示のままです"
        - "スマホ / タブレットで VR180・VR360 のパノラマをジャイロ操作で見回せるようになりました：端末を動かすと視点が回り、指でドラッグして微調整もできます。既定はオフで、初めてパノラマ表示に入ったときに一度だけ確認し、以後はプレーヤー設定やパノラマのツールバーで切り替えられます"
        - "HTTP プロキシ設定をサーバーとポートの別入力に変更。完全なアドレスを貼り付けると自動で分割され、保存前に接続テストもできます"
        - "インターフェース素材の見た目（不透明度・背景ぼかしなど）を調整でき、スライダー操作が即座に反映されます。ダイアログやドロワー内のリキッドグラスが見えなくなる問題を修正"
        - "ページ全体のスワイプで戻る操作を各プラットフォーム標準のジェスチャー（iOS の端スワイプ、Android の予測型「戻る」）に変更"
        - "AI 翻訳：目的の言語に訳されない・押しても反応しない問題を修正し、翻訳プロンプトをアプリ内蔵で目的言語に合わせて生成するようにしました。失敗時は具体的な原因を表示し、長い投稿が途中で切れる問題やストリーミング中に画面が頻繁に再描画される問題も解消"
        - "動画が 360p しか選べなくなる問題を修正：公式サイトが署名を変更しても、新バージョンを待たずにアプリが自動で追従します（Sakura-Natsu さんに感謝、#135）"
        - "Windows：起動後約 0.1 秒でスプラッシュ画面が出るようになり、2〜3 秒何も表示されない状態を解消。リキッドグラス有効時に最初の画面が 20 秒近く白くなる問題、ウィンドウを閉じた後も数秒音が鳴り続ける問題を修正"
        - "Windows：モニターの HDR がオンのとき他のウィンドウに切り替えると画面が暗くなる問題、プレーヤーがコメント欄のフォーカスを奪う（英字しか入力できない）問題を修正。VR のパノラマ表示が上下逆さまにならなくなりました"
        - "デスクトップ：サイドバーの戻るボタンや Esc で「もう一度押すと終了」と出るのに終了できない問題、全画面や最大化のまま閉じると次回ウィンドウが画面外に開く問題を修正。macOS のタイトルバーを信号機ボタンの位置に揃えました"
        - "Quest：ハンドでウィンドウをドラッグするとレイが暴れる問題、コントロールパネルを呼び出すと手とレイが固まってから飛ぶ問題を修正。「続けて見る」で切り替えた後にバッファリング表示が残らなくなりました"
        - "Android で通知シェードを下ろしたときや小窓がフォーカスを失ったときにプライバシーカバーが画面を覆ってしまう問題、「すぐにロック」で誤ってロックされる問題を修正（#123）"
        - "プレビューから詳細を開いて戻るとカードが空白になる問題を修正（#125）。カスタムカバーを設定した動画でもアニメーションプレビューが出るようになりました"
        - "その他の修正：ローカル動画で「ネットワークを確認してください」と誤表示される問題、マウスホイールで横方向のリストがスクロールできない問題、リストの最後の行が右下のボタンに隠れる問題、フォーラムのページ送りモードで返信の編集に失敗する問題（返信後は新しい階へ移動）、oreno3d の照合が Cloudflare に阻まれる問題、キーボード表示中にメニューを開くとシートが沈む問題"
        - "クラッシュ調査：ログをオフにしていてもクラッシュの原因を記録し、次回起動後にログを書き出すと一緒に含まれるため、不具合の報告がしやすくなりました"
        - "パフォーマンス：動画ページを一度開くとバックグラウンドで続いていた高頻度のポーリングを廃止。リストのカードの合成レイヤーを減らしてスクロールを滑らかに。待機中に毎フレーム再描画しなくなり、電池の持ちが改善"
  - version: "0.6.1"
    date: "2026-09-16"
    changes:
      zh-CN:
        - "新增「本机文件」顶栏主栏目：可直接在应用内管理与播放设备本地的视频与图片，支持在导航设置中自由开启或隐藏"
        - "「本机文件」提供七大分类：文件目录、常用目录（长按文件夹置顶）、精选视频、所有视频、所有图片、下载完成视频、下载完成图库"
        - "本地文件全面支持自然数字排序（如 ep1, ep2, ep10 正确递增），并支持按名称、修改时间、时长、大小、分辨率、文件类型、帧率、精选时间等多维排序"
        - "本地文件夹支持自定义封面：可在目录中任选一帧或图片作为封面，亦可随时一键恢复自动封面"
        - "文件夹支持查看详细信息（路径、占用空间、文件数、最近扫描时间）、复制路径，并支持安全彻底删除磁盘上的文件或从库中移除"
        - "本地视频播放无缝记录播放进度，并支持在管理菜单中一键清理全部本地播放进度"
        - "下载完成的视频与图库自动同步汇入本机文件对应栏目，实现线上下载与离线管理无缝统一"
        - "VR180、VR360、左右 3D（SBS）、上下 3D（TB）片源智能识别：结合标题与简介语义、标签、视频宽高比，以及 MP4 容器立体元数据（sv3d / st3d）与本地文件名进行两阶段高精度推断"
        - "检测到疑似 VR 视频时在进度条上方提供温和建议提示（如「这可能是 VR180 左右片源」），杜绝因误判导致普通视频被强行拆分"
        - "播放器新增「播放模式」菜单：支持在普通视频、左右 3D、上下 3D、VR180（左右/单目）、VR360（单目/上下）之间自由切换，支持记忆手动指定与一键重置为自动识别"
        - "手机、平板与桌面端支持全景实时环视（Panorama Shader）：播放 VR180/360 视频时，拖拽画面即可 360° 环视视角，双指捏合可缩放视野角（FOV）"
        - "常规设备播放左右 3D / 上下 3D 片源时，自动执行单眼智能裁切并精确还原原生画面比例，告别被挤扁的画面"
        - "Quest 空间沉浸式观影体系（Meta Quest 版）：视频与图库脱离 2D 浮板进入原生 3D 虚拟空间，在独立空间幕布（平面、弧面、180°/360° 全天球）中呈现"
        - "内置星空轨道（Orbital）、深空月球与地球、极光（Aurora）、日落（Sunset）、云海（Clouds）、薄雾（Mist）等多种高精度 3D 沉浸背景环境"
        - "空间动态媒体氛围光（Media Ambience）：幕布向周围空间投射随画面实时变化的柔和氛围光与光晕特效（Halo / Bloom）"
        - "空间画廊（Spatial Gallery）：在空间中展开全本画廊弧形幕布，支持摇杆翻页、缩略图胶片点选，以及 3/5/10/20 秒多档自动幻灯片播放"
        - "完整支持 Quest 控制器与纯手势追踪（Hand Tracking）：侧握键抓取与挪动幕布、双手侧握拉开/缩放幕布、摇杆推拉调节观看距离与进度、双手捏合缩放"
        - "交互式手柄操作指引（Quest Gesture Guide）：内置大图矢量手势与按键动画教学，直观演示每个按键与手势功能"
        - "Quest 2D 面板视频详情页升级为剧院式模糊展台封面，一键平滑交接至空间幕布播放"
        - "长按 / 右键呼出「媒体预览弹窗」（“凑近看一眼”）：大尺寸高清封面、动态预览动图、完整标题、作者信息、数据统计及全部标签一目了然，三点按钮专注呼出操作菜单"
        - "图库卡片预览支持在弹窗内直接横滑翻阅整本画廊的所有图片，并在图片上点击或直接向下拖动即可无缝流转进入全屏大图查看器"
        - "卡片与媒体预览弹窗之间支持流畅完整的卡片展开与收起 Hero 动效"
        - "全屏大图页底部新增自适应宽高比的缩略图胶片条（Filmstrip），当前浏览图片自动居中，千张超大图库毫秒级极速渲染与拖拽，桌面端支持滚轮横向滚动"
        - "图库内视频新增专属悬浮玻璃控制条，提供播放/暂停、精准进度控制、浮动时间预览窗口、静音切换以及一键横屏全屏/竖屏旋转切换"
        - "图库大图双击可在 2.5× 放大与原图间快速切换，提供重置缩放按钮；新增图库播放/暂停、快退快进、静音等快捷键"
        - "界面材质选项规范为「液态玻璃」与「Material」两档：切换为 Material 模式时，顶栏、菜单、弹窗与底部导航栏全部换为标准 Material 3 实心样式（无模糊、无 shader、无阴影），大幅降低发热并提升续航"
        - "优化液态玻璃淡入淡出动画（Materialize），消除弹窗与菜单展开时“文字先出现、玻璃背景后到”的视觉瑕疵"
        - "底部浮动导航栏智能适配 4 格与 5 格布局，针对中、英、日、繁中不同文字长度动态调整间距与字号，杜绝标签截断省略"
        - "搜索胶囊输入框交互优化，长按移动光标时禁用跟手弹性形变，输入体验更扎实"
        - "全新 Material 3 全局轻提示（AppToast）：实心浮起卡片设计，字数自适应停留时长，支持滑走与悬停暂停，自动避让顶底栏"
        - "在本地文件、下载任务详情等长列表页面加入全新玻璃悬浮返回顶部按钮（ScrollToTopFab）"
        - "订阅页顶部的「特别关注」首次引导卡片采用动态主题配色与清晰的步骤轨指引重绘"
        - "界面语言扩展至 12 门：新增德语、西班牙语、法语、印尼语、韩语、俄语、泰语、越南语，与原有的英文、日文、简体中文、繁体中文并列（标签词库暂未同步扩容，新增语言下标签会回退显示英文译名）"
      en:
        - "New \"Local Media\" top-level section: browse and play videos and images stored on your device directly within the app, with the ability to show or hide the tab in navigation settings"
        - "Local Media categorized into seven dedicated views: Folders, Pinned Folders (long-press to pin), Favorite Videos, All Videos, All Images, Downloaded Videos, and Downloaded Galleries"
        - "Natural numeric sorting for local files (e.g., ep1, ep2, ep10 properly ordered), with multi-dimensional sorting by name, date modified, duration, file size, resolution, file type, fps, and favorite date"
        - "Custom folder covers: pick any video frame or image inside a folder to use as its cover, or restore automatic cover generation at any time"
        - "In-place file management: view folder details (path, disk size, item count, last scanned), copy path, safely delete files from disk, or remove folders from the library"
        - "Playback progress is automatically remembered for local videos, with an option to clear all local watch history in one tap"
        - "Completed video and gallery downloads are automatically synchronized into the corresponding Local Media tabs for seamless offline browsing"
        - "Intelligent VR & 3D video detection: two-phase inference supporting VR180, VR360, Side-by-Side 3D, and Top-Bottom 3D based on title, description, tags, aspect ratio, MP4 container stereo boxes (sv3d / st3d), and filename rules"
        - "Gentle VR suggestions: displays an unobtrusive tip above the seekbar when a VR format is suspected (e.g. \"Might be VR180 Side-by-Side\"), avoiding aggressive false-positive screen splits"
        - "Dedicated \"Playback Mode\" menu: switch freely between Flat, SBS 3D, Top-Bottom 3D, VR180 (SBS/Mono), and VR360 (Mono/TB), with support for user override memory or resetting to auto-detection"
        - "360° Panorama Shader on phones, tablets, and desktops: drag the screen to look around in 360° and pinch to adjust Field of View (FOV) when watching VR180/VR360 videos"
        - "Single-eye cropping and aspect ratio restoration for SBS and Top-Bottom 3D videos on standard devices, eliminating squished side-by-side images"
        - "Quest XR Immersive Experience (Meta Quest build): videos and galleries leave the 2D floating panel and render on independent spatial canvases (flat, curved, 180°/360° dome) in native 3D space"
        - "High-fidelity 3D virtual environments: choose between Orbital starfield, Deep Space Earth & Moon, Aurora, Sunset, Clouds, and Mist backgrounds"
        - "Dynamic Media Ambience: video canvases project soft ambient illumination and halo bloom effects into the surrounding space in real time"
        - "Spatial Gallery: spreads galleries onto curved spatial canvases with thumbstick paging, filmstrip item picking, and automatic slideshows (3/5/10/20s intervals)"
        - "Full Quest controller and hand-tracking support: grip to grab/move screens, dual-grip to scale, thumbstick for distance and scrubbing, and pinch gestures"
        - "Interactive Quest Gesture Guide: large animated vector demonstrations explaining every controller button and hand gesture"
        - "Theatre-style blurred cover display on Quest 2D detail panels, seamlessly handing off playback to the spatial canvas"
        - "Long-press / right-click Media Preview Dialog: preview cards without leaving the list with large cover art, animated GIF preview, stats, and complete tags; three-dot button is dedicated to the action menu"
        - "Browse entire galleries inside the preview modal: swipe horizontally through all images, and tap or drag down on an image to smoothly transition into the fullscreen photo viewer"
        - "Smooth Hero morphing transition expanding from the card into the preview dialog and collapsing back on dismiss"
        - "Fullscreen photo viewer bottom filmstrip: adaptive aspect ratio thumbnail strip pinned to the bottom with fast binary-search scrolling for thousands of images and desktop mouse wheel support"
        - "Dedicated in-gallery video control bar: glass playback controls with seekbar, hover time preview, mute toggle, and one-tap landscape/portrait orientation switching"
        - "Double-tap photo zoom toggling between 2.5× and 1.0×, with zoom reset button and keyboard shortcuts for gallery playback, seeking, and mute"
        - "Interface Material options streamlined to \"Liquid Glass\" and \"Material\": switching to Material mode converts top bar, menus, dialogs, and bottom navigation bar into standard M3 solid styles with no blur, no shaders, and no shadows for maximum battery life"
        - "Refined liquid glass fade animations (Materialize), eliminating visual glitches where text would appear before the glass backdrop finished rendering"
        - "Adaptive bottom floating tab bar layout adjusting between 4 and 5 tabs, preventing label truncation across all supported languages"
        - "Refined search capsule input, disabling elastic stretching when long-pressing to reposition the cursor"
        - "New AppToast notification system: solid Material 3 elevated cards with text-length reading duration estimation, swipe-to-dismiss, hover pause, and automatic obstacle avoidance"
        - "Added a glass floating back-to-top button (ScrollToTopFab) on long list pages"
        - "Redesigned the Special Follow introductory card in subscriptions with theme-adaptive styling and a clear step track"
        - "UI now speaks 12 languages: added German, Spanish, French, Indonesian, Korean, Russian, Thai, and Vietnamese alongside the existing English, Japanese, Simplified Chinese, and Traditional Chinese (the tag dictionary hasn't caught up yet — tags fall back to their English name in the new languages)"
      ja:
        - "「ローカルファイル」タブを新設：デバイス内の動画や画像をアプリ内で直接管理・再生できるようになり、ナビゲーション設定から表示／非表示を切り替えられます"
        - "ローカルファイルに 7 つの分類を追加：「フォルダ」「よく使うフォルダ（長押しでピン留め）」「厳選動画」「すべての動画」「すべての画像」「ダウンロード完了動画」「ダウンロード完了ギャラリー」から閲覧できます"
        - "ローカルファイルが自然順ソートに対応（ep1, ep2, ep10 が正しく整列）。名前・更新日時・再生時間・ファイルサイズ・解像度・形式・フレームレート・厳選追加日時など多角的な並び替えが可能です"
        - "ローカルフォルダのカバー画像を自由にカスタマイズ可能に。フォルダ内の任意のコマや画像を選択して設定でき、いつでも自動生成に戻せます"
        - "フォルダの詳細情報表示（パス・使用容量・ファイル数・最終スキャン日時）、パスのコピー、ファイルの安全な完全削除およびライブラリからの削除に対応しました"
        - "ローカル動画の再生位置を自動記録し、管理メニューからローカルの視聴履歴を一括消去できるようにしました"
        - "ダウンロード完了済みの動画とギャラリーがローカルファイルへ自動的に同期・反映されるようになりました"
        - "VR180・VR360・左右 3D（SBS）・上下 3D（TB）の自動判定に対応。タイトル・概要欄・タグ・動画のアスペクト比、MP4 の立体メタデータ（sv3d / st3d）やファイル名規則から 2 段階で高精度に推定します"
        - "VR の可能性がある動画ではシークバー上に控えめな提案バナー（例: 「VR180 左右の可能性があります」）を表示し、誤判定で通常の動画が分割されてしまうのを防ぎます"
        - "プレイヤーに「再生モード」メニューを追加：通常動画・左右 3D・上下 3D・VR180（左右／単眼）・VR360（単眼／上下）を手動で切り替えられ、指定の記憶や自動判定への復帰も可能です"
        - "スマホ・タブレット・PC での VR 全天球見回し（Panorama Shader）に対応：画面をドラッグして 360° 視点を動かせ、ピンチ操作で視野角（FOV）を調整できます"
        - "通常のデバイスで左右 3D や上下 3D の動画を再生する際、片目を自動でトリミングし本来のアスペクト比に復元して表示できるようにしました"
        - "Quest 空間での没入型視聴体系（Meta Quest 版）：動画やギャラリーが 2D パネルから飛び出し、仮想 3D 空間の独立したスクリーン（平面・曲面・180°/360° 全天球）で再生されます"
        - "高精度な 3D 仮想環境を搭載：軌道星空（Orbital）・深宇宙の月と地球・オーロラ（Aurora）・夕焼け（Sunset）・雲海（Clouds）・霧（Mist）などの背景を選択できます"
        - "動的アンビエントライティング（Media Ambience）：スクリーンの映像に合わせて周囲の空間へ柔らかな環境光とハロー（Halo）エフェクトを投射します"
        - "空間ギャラリー（Spatial Gallery）：全編の画像を曲面スクリーンで展開し、スティック送り・サムネイル選択・自動スライドショー（3/5/10/20秒間隔）に対応しました"
        - "Quest コントローラーとハンドトラッキングに完全対応：グリップでスクリーンの掴み・移動、両手グリップで拡縮、スティックで視聴距離やシーク調整、手でのピンチ操作に対応しています"
        - "インタラクティブな Quest 操作ガイドを追加：手柄の各ボタンやハンドジェスチャーの役割をベクターアニメーションでわかりやすく解説します"
        - "Quest 2D パネル内の動画詳細ページを劇場風のぼかしカバー展示に刷新し、空間スクリーンへスムーズに再生を引き継げます"
        - "長押し／右クリックの「メディアプレビュー」ダイアログ：カード長押しやデスクトップの右クリックで、詳細を開かずに大判カバー・プレビューGIF・統計・タグを一括確認できます"
        - "ギャラリーのプレビュー内で全画像を直接スワイプ閲覧できるようになり、画像をタップまたは下ドラッグするだけで全画面ビューアへスムーズに移行できます。3 点ボタンは操作メニュー専用になりました"
        - "カードからプレビュー画面へ滑らかに変形する Hero アニメーションを追加しました"
        - "全画面画像ビューアの最下部にサムネイルフィルムストリップを追加：各画像本来の縦横比を維持したまま中央揃えで配置され、数千枚の巨大ギャラリーでもミリ秒単位で高速スクロールできます。デスクトップではマウスホイールの横スクロールに対応しました"
        - "ギャラリー内の動画に専用のガラスコントロールバーを追加：再生／一時停止・シークバー・時間プレビュー・ミュート切り替え、縦横画面のワンタップ回転に対応しました"
        - "画像ビューアのダブルタップで 2.5 倍拡大と等倍を瞬時に切り替えられるようにし、ズーム復帰ボタンや再生／一時停止・シーク・ミュートのショートカットキーを追加しました"
        - "UI 質感の選択肢を「リキッドグラス」と「Material」に整理：Material モード時はヘッダー・メニュー・ダイアログ・下部バーがすべて M3 標準の不透明フラットスタイルになり、省電力とパフォーマンスを最優先できます"
        - "リキッドグラスのフェードアニメーション（Materialize）を改善し、メニュー展開時に「文字が先に現れてガラスが後から遅れて表示される」ちらつきを解消しました"
        - "下部フローティングタブバーが 4 項目と 5 項目のレイアウトに自動適応し、多言語でもラベル文字が省略されにくくなりました"
        - "検索入力欄の質感を改善し、カーソル移動の長押し時に不要なぐにゃぐにゃとした変形が起きないようにしました"
        - "新しいトースト通知（AppToast）：Material 3 のソリッドカード形式に刷新し、文字数に応じた表示時間計算、スワイプ消去、ホバーによる一時停止、ヘッダー・フッターの自動回避に対応しました"
        - "長いリストページにガラス質感の「トップへ戻る」フローティングボタンを追加しました"
        - "購読ページの「特別フォロー」初回ガイドカードをテーマ連動カラーとわかりやすいステップ表示に刷新しました"
        - "UI 対応言語を 12 言語に拡張：ドイツ語・スペイン語・フランス語・インドネシア語・韓国語・ロシア語・タイ語・ベトナム語を、既存の英語・日本語・簡体字中国語・繁体字中国語に追加しました（タグ辞書はまだ対応拡張が済んでおらず、新規言語ではタグが英語表記にフォールバックします）"
  - version: "0.5.1"
    date: "2026-08-30"
    minVersion: "0.3.0"
    changes:
      zh-CN:
        - "全新液态玻璃界面：悬浮玻璃头部 + 浮动底栏，全站弹窗、菜单、开关、滑块、输入框、下拉、分页栏与批量选择统一玻璃化，并带按压蠕动、长按跟手拖拽等反馈"
        - "主题设置新增「玻璃质感」开关：可在液态玻璃（模糊 + 折射）与轻量半透明（零 shader、更省电）之间切换，即时生效无需重启"
        - "玻璃菜单支持「按住不放、直接划到某一条松手选中」；长按评论、楼层、私信正文与图库图片也能就地弹出操作菜单"
        - "论坛与新闻合并为「社区」栏目，页内下拉切换"
        - "设置页的返回操作更贴近系统原生：一层层往回退，手势与转场都和应用里其他页面一样"
        - "播放器设置由底部弹窗改为整页右侧抽屉，并带分区导航；全屏横屏下不再被挤成窄窄一条"
        - "新增「自动进入全屏」设置：可选「播放时」或「进入详情页时」自动全屏，桌面端还可选系统全屏或应用全屏，默认关闭"
        - "恢复「已从上次位置继续播放」提示，并新增「从头播放」的反悔按钮"
        - "进度条预览窗口重做：窗口大小跟随播放器与视频比例（竖屏视频给竖窗口），并新增「预览窗口大小」三档"
        - "优化自定义快捷键的效果，让自定义快捷键能够被更准确地触发"
        - "新增「用其他应用打开」：可把当前视频交给 MX Player / VLC，VR 头显交给 Skybox、Pigasus 等播放器，桌面端可自定义外部播放器（带 Steam 库自动探测）；优先使用本地或已下载的文件，并提供「复制视频链接」兜底"
        - "播放器锁定状态现在也会拦住键盘与鼠标操作"
        - "修复 Anime4K 在部分移动 GPU 上导致的「有声音没画面」黑屏：渲染失败会自动关闭并提示"
        - "播放错误提示不再遮挡和吞掉播放条，并修正了把 FFmpeg 调试信息误报成播放失败的问题"
        - "新增「稍后再看」，以及卡片操作菜单（下载 / 稍后再看 / 播放列表 / 本地收藏 / 分享 / 点赞 / 作者主页），三点按钮、右键与长按都能唤出"
        - "「接着看」全面重做：改为竖排侧边抽屉，全屏与非全屏都能打开；可播的池也从单一的「来源」扩展到订阅、我的播放列表、他人的播放列表、作者的播放列表、作者的视频、最爱、本地收藏、已下载与稍后再看；「来源」本身还会顺着你正在看的那份列表（含筛选条件）一直往下翻，不再只有进来时的那几十条。图库同样支持"
        - "下载分类条改为下拉胶囊，并显示每个分类的数量"
        - "下载失败原因改为分类展示（网络、服务器拒绝、资源失效、磁盘空间不足、文件被占用、权限等），一眼看出该不该重试；异常原文仍可长按复制"
        - "应用重启后未完成的下载一律暂停，列表顶部提示条可一键全部继续，不再在你不知情时消耗流量"
        - "下载的暂停 / 继续 / 重试改为即时响应，失败会自动回滚并提示"
        - "修复下载遇到失效链接时反复重试却不刷新地址的问题；远端换了文件会重新下载，而不是拼出一个损坏文件"
        - "修复下载完成后任务从「下载中」消失、却不出现在历史区的问题"
        - "搜索弹窗重构为多端自适应的搜索页面；长按搜索按钮可直接挑选八种搜索模式；「已保存搜索」从二级菜单提到常驻入口"
        - "标签列表页改为单行悬浮头部，并接入筛选抽屉"
        - "标签中文词库大规模补全与纠错：oreno3d 补回 3500+ 个此前抓不到的角色（共 6144 条），iwara 更新至 2942 条，两份词库的中文译名已无日文假名残留"
        - "Oreno3D 匹配的请求量与卡顿大幅下降并加入结果缓存；Oreno3D 视频卡片版式与站内其他卡片对齐"
        - "新增应用锁：PIN（4–8 位）与生物识别解锁，可设置离开应用多久后锁定、系统锁屏后是否需要重新验证，并自动隐藏后台预览画面；隐私模式与应用锁合并为同一张「隐私」卡片，并按平台如实说明能力"
        - "修复 Quest 上应用被锁死宽度上限的问题"
        - "侧滑返回不再和页内的左右滑动打架：在标签页、横向列表、进度条上会先让给内容，滑到头才触发返回，整页跟手返回的手感保持不变"
        - "修复重装或换新机后首次引导不再出现、更新提示与引导页互相遮挡，以及每次启动都弹更新提示的问题"
        - "修复主站与 AI 站跨站切换、以及通过链接冷启动时的站点异常"
        - "DLNA 投屏操作串行化，并过滤掉不支持播控的设备"
        - "修复 Windows 11 下关闭窗口弹出 \"Unknown Hard Error\" 的问题；统一各处清晰度排序与画质文案"
        - "日志系统性能整改，并修复诊断页「日志丢弃较多」的永久误报"
        - "升级到 Flutter 3.47；构建产物改为每个安装包单独一项，下载时不必整包拖回；新增繁体中文与日文 README"
      en:
        - "A brand-new liquid-glass interface: overlay glass headers and a floating tab bar, with dialogs, menus, switches, sliders, inputs, dropdowns, pagination bars and batch selection all unified in glass — plus press-and-stretch and long-press drag-to-follow feedback"
        - "Theme settings gained a \"Glass material\" switch: choose between liquid glass (blur + refraction) and lightweight translucency (no shaders, easier on the battery), applied instantly with no restart"
        - "Glass menus now support \"hold, slide to an item, release to pick it\"; long-pressing comments, forum replies, private-message bodies and gallery images opens an action menu right where your finger is"
        - "Forum and News merged into a single Community section, with an in-page dropdown to switch between them"
        - "Back navigation in settings now feels like the rest of the system: it steps back one level at a time, with the same gesture and transition as every other page in the app"
        - "Player settings moved from a bottom sheet to a full-height right-side drawer with section navigation, so it is no longer squeezed into a sliver in landscape fullscreen"
        - "New \"Auto-enter fullscreen\" setting: trigger on playback start or on opening the detail page; on desktop you can also pick system fullscreen or in-app fullscreen (off by default)"
        - "Restored the \"resumed from your last position\" tip, and added a \"Play from start\" button to undo it"
        - "The seek preview window was rebuilt: it now sizes itself from the player and the video's own aspect ratio (portrait videos get a portrait window), with a new three-step preview window size setting"
        - "Improved custom shortcuts so they are triggered more accurately and reliably"
        - "New \"Open with another app\": hand the current video to MX Player / VLC, to Skybox or Pigasus on a VR headset, or to a custom external player on desktop (with automatic Steam library detection); it prefers local or already-downloaded files, and offers \"Copy video link\" as a fallback"
        - "The player's locked state now also blocks keyboard and mouse input"
        - "Fixed Anime4K causing \"sound but no picture\" black screens on some mobile GPUs — it now switches itself off and tells you when shader rendering fails"
        - "Playback error messages no longer cover or swallow the playback bar, and FFmpeg debug output is no longer misreported as a playback failure"
        - "Added Watch Later, along with a card action menu (download / watch later / playlist / local favorites / share / like / go to author) reachable from the three-dot button, right-click and long-press"
        - "Up Next was rebuilt: it is now a vertical side drawer that opens both in and out of fullscreen, and the queues you can play from grew from a single \"Source\" to subscriptions, your own playlists, other people's playlists, the author's playlists, the author's videos, favorites, local favorite folders, downloads and Watch Later. Source itself also keeps paging through the very list you came from — filters included — instead of stopping at the few dozen items loaded at the time. Galleries are supported too"
        - "The download category bar became a dropdown pill and shows the item count for each category"
        - "Download failures are now shown by category (network, server rejected, resource gone, disk full, file in use, permission, and more) so you can tell at a glance whether retrying will help; the raw error is still available via long-press to copy"
        - "Unfinished downloads are all paused after an app restart, with a banner at the top of the list to resume them all in one tap — no more silently using your data"
        - "Pause / resume / retry now respond instantly, rolling back with a message if the operation fails"
        - "Fixed downloads retrying a dead link over and over without refreshing the address; if the remote file actually changed, it is re-downloaded instead of stitched into a corrupted file"
        - "Fixed completed downloads vanishing from the active section without ever appearing in history"
        - "The search dialog was rebuilt as a search page that adapts across screen sizes; long-pressing the search button lets you pick any of the eight search modes directly; saved searches was promoted from the overflow menu to a permanent entry"
        - "Tag list pages now use a single-row overlay header and the shared filter drawer"
        - "A large pass over the Chinese tag dictionaries: oreno3d regained 3,500+ characters that were previously unreachable (6,144 entries total), iwara was refreshed to 2,942 entries, and neither dictionary's Chinese names contain leftover Japanese kana any more"
        - "Oreno3D matching makes far fewer requests, costs far less main-thread time and now caches results; Oreno3D video cards were aligned with the rest of the app's card layout"
        - "New App Lock: a 4–8 digit PIN plus biometric unlock, with settings for how long after leaving the app it locks and whether a system screen-off requires re-authentication, and automatic hiding of the background preview; privacy mode and App Lock were merged into one Privacy card that states honestly what each platform can actually do"
        - "Fixed the app being stuck at a width limit on Quest"
        - "Swipe-back no longer fights with horizontal scrolling inside a page: on tabs, horizontal lists and sliders the content gets the gesture first, and the back swipe only takes over once you have reached the end. Full-page follow-your-finger back navigation feels exactly as before"
        - "Fixed the first-run guide never showing again after a reinstall or on a new phone, the update dialog and the guide covering each other, and the update prompt appearing on every launch"
        - "Fixed site switching between the main site and the AI site, and the site chosen when cold-starting from a link"
        - "DLNA casting operations are now serialized, and devices that cannot control playback are filtered out of discovery"
        - "Fixed the \"Unknown Hard Error\" dialog when closing the window on Windows 11; unified quality ordering and quality labels everywhere"
        - "Reworked logging performance and fixed the diagnostics page permanently claiming that too many logs were dropped"
        - "Upgraded to Flutter 3.47; build artifacts are now one per installer so you no longer have to download the whole bundle; added Traditional Chinese and Japanese READMEs"
      ja:
        - "全面刷新のリキッドグラス UI：フローティングのガラスヘッダーとタブバーに加え、ダイアログ・メニュー・スイッチ・スライダー・入力欄・ドロップダウン・ページャー・一括選択までガラス表現で統一し、押し込みの変形や長押しドラッグの追従も追加しました"
        - "テーマ設定に「ガラス質感」スイッチを追加：リキッドグラス（ぼかし＋屈折）と軽量半透明（シェーダーなし・省電力）を切り替えられ、再起動なしで即反映されます"
        - "ガラスメニューが「押したまま項目までスライドして離すと選択」に対応。コメント・スレッド・DM 本文・ギャラリー画像も長押しでその場に操作メニューが開きます"
        - "フォーラムとニュースを「コミュニティ」に統合し、ページ内のドロップダウンで切り替えられるようにしました"
        - "設定画面の「戻る」がシステム標準の挙動に近づきました。1 階層ずつ戻り、ジェスチャーや遷移もアプリの他のページと同じです"
        - "プレイヤー設定をボトムシートから全画面高さの右サイドドロワーに変更し、セクションナビゲーションを追加。横向き全画面でも潰れなくなりました"
        - "「自動で全画面にする」設定を追加：再生開始時／詳細ページを開いた時から選べ、デスクトップではシステム全画面かアプリ内全画面かも選択できます（既定はオフ）"
        - "「前回の位置から再生を再開しました」の通知を復活させ、「最初から再生」で取り消せるようにしました"
        - "シークプレビューを作り直しました。ウィンドウサイズはプレイヤーと動画自身の比率に追従し（縦動画には縦のウィンドウ）、「プレビューウィンドウのサイズ」を 3 段階から選べます"
        - "カスタムショートカットの動作を改善し、より正確に反応するようになりました"
        - "「他のアプリで開く」を追加：現在の動画を MX Player / VLC、VR ヘッドセットでは Skybox や Pigasus、デスクトップでは任意の外部プレイヤー（Steam ライブラリの自動検出付き）に渡せます。ローカル・ダウンロード済みファイルを優先し、「動画リンクをコピー」も用意しました"
        - "プレイヤーのロック中はキーボードとマウス操作もブロックするようになりました"
        - "一部のモバイル GPU で Anime4K が「音は出るが映像が真っ暗」になる問題を修正。シェーダー描画に失敗すると自動的に無効化して通知します"
        - "再生エラー表示がシークバーを覆って操作を奪わないようにし、FFmpeg のデバッグ出力を再生失敗と誤報していた問題を修正しました"
        - "「あとで見る」を追加。カードの操作メニュー（ダウンロード／あとで見る／プレイリスト／ローカルお気に入り／共有／いいね／作者ページ）も、3 点ボタン・右クリック・長押しから開けます"
        - "「続けて見る」を全面的に作り直しました。縦並びのサイドドロワーになり全画面でもそれ以外でも開けるほか、再生元が「ソース」だけだったものが、購読・自分のプレイリスト・他の人のプレイリスト・作者のプレイリスト・作者の動画・お気に入り・ローカルお気に入り・ダウンロード済み・あとで見るへと広がりました。「ソース」自体も、いま見ているリスト（絞り込み条件込み）をそのまま辿って読み込み続けます。ギャラリーにも対応しています"
        - "ダウンロードのカテゴリー欄をドロップダウンピルに変更し、各カテゴリーの件数を表示します"
        - "失敗理由を分類表示（ネットワーク／サーバー拒否／リソース消失／空き容量不足／ファイル使用中／権限など）に変更し、再試行すべきか一目で分かるようにしました。元のエラー文言は長押しでコピーできます"
        - "アプリ再起動後は未完了のダウンロードをすべて一時停止し、リスト上部のバナーからまとめて再開できるようにしました。知らないうちに通信量を使うことはなくなります"
        - "一時停止／再開／再試行が即座に反映されるようになり、失敗時は自動で元に戻して通知します"
        - "リンク切れのまま何度も再試行してアドレスを取り直さない問題を修正。リモート側でファイルが変わった場合は、壊れたファイルを継ぎ足さずに再ダウンロードします"
        - "ダウンロード完了後にタスクが「ダウンロード中」から消えたまま履歴にも現れない問題を修正しました"
        - "検索ダイアログをマルチデバイス対応の検索ページに刷新。検索ボタンの長押しで 8 種類の検索モードを直接選べ、「保存した検索条件」をメニューの奥から常設の入口に引き上げました"
        - "タグ一覧ページを 1 行のフローティングヘッダーに変更し、絞り込みドロワーに対応しました"
        - "タグの中国語辞書を大規模に補完・修正しました。oreno3d はこれまで取得できなかったキャラクター 3,500 件以上を回収（合計 6,144 件）、iwara は 2,942 件に更新し、いずれの辞書も中国語訳に仮名が残っていません"
        - "Oreno3D の照合はリクエスト数とメインスレッドの負荷を大幅に削減し、結果をキャッシュするようになりました。Oreno3D の動画カードも他のカードと同じレイアウトに揃えています"
        - "アプリロックを追加：4〜8 桁の PIN と生体認証に対応し、アプリを離れてから何秒でロックするか、画面消灯後に再認証を求めるかを設定でき、バックグラウンドのプレビューも自動的に隠します。プライバシーモードとアプリロックは 1 枚の「プライバシー」カードにまとめ、プラットフォームごとにできること・できないことを正確に表示します"
        - "Quest でアプリの幅が上限で固定されてしまう問題を修正しました"
        - "スワイプで戻る操作がページ内の横スワイプと競合しなくなりました。タブ・横スクロールリスト・スライダーではまず中身が優先され、端まで来てから戻る操作になります。ページ全体の追従的な戻る操作の感触はこれまでどおりです"
        - "再インストール後や機種変更後に初回ガイドが表示されない問題、アップデート通知とガイドが重なる問題、起動のたびにアップデート通知が出る問題を修正しました"
        - "メインサイトと AI サイトの切り替え、およびリンクからのコールドスタート時のサイト判定の不具合を修正しました"
        - "DLNA キャストの操作を直列化し、再生制御に対応していない機器を検出結果から除外しました"
        - "Windows 11 でウィンドウを閉じると \"Unknown Hard Error\" が表示される問題を修正し、画質の並び順と表記を全体で統一しました"
        - "ログ機構の性能を改善し、診断ページの「ログの破棄が多い」という誤警告が出続ける問題を修正しました"
        - "Flutter 3.47 に更新。ビルド成果物をインストーラーごとに 1 件へ分割し、まとめてダウンロードする必要がなくなりました。繁体字中国語と日本語の README も追加しています"
  - version: "0.5.0"
    date: "2026-07-05"
    minVersion: "0.3.0"
    changes:
      zh-CN:
        - "全应用快捷键支持自定义配置，可自由切换按键，并新增快捷键设置页面供用户管理；播放器长按左/右可直接进入倍速播放（不再像过去那样只触发一次快进/后退）"
        - "播放器画面新增缩放与旋转手势：触控板/触屏支持双指捏合，鼠标支持 Shift 或 Ctrl + 滚轮，实现画面放大、缩小与旋转"
        - "播放器新增画面尺寸调节（适应/拉伸/填充/16:9/4:3，仅对当前播放器生效）"
        - "播放器与图库均新增色觉辅助滤镜（两处开关相互独立），提供三档色盲/色弱辅助模式"
        - "窄屏竖屏播放状态下支持上滑，将播放器收缩至最小高度"
        - "Oreno3d 与 iwara 标签均支持本地化切换、长按查看详情，以及复制与翻译纠错反馈"
        - "下载列表新增自定义分类，下载时可选择分类，删除后保留滚动位置"
        - "下载支持按日期区间/N 天前批量删除任务；完成提示移至底部并支持点击跳转；列表元素按屏宽等比缩放，小屏更紧凑"
        - "搜索弹窗布局优化（Oreno3D 入口/谷歌搜索/历史确认），支持不输入关键词仅凭筛选与排序浏览"
        - "搜索结果页支持保存与还原搜索条件"
        - "热门视频/图库筛选项新增常驻入口与收藏快捷筛选"
        - "AI 翻译新增多服务商接入（OpenAI 及兼容端点 / Anthropic / Google 原生），支持流式输出与思考过程折叠，可在设置中选择服务商预设并拉取模型列表"
        - "新增本地内容屏蔽：可按关键词、正则或作者用户 ID 屏蔽视频与图库，规则仅存本地并随设置备份，也支持屏蔽规则单独导入导出，被屏蔽卡片以磨砂遮罩呈现并可临时显示"
        - "视频简介与评论中的时间节点（如 1:23、1:23:45）自动高亮，点击可直接跳转到对应播放位置"
        - "首次进入视频详情页时新增一次性手势操作指引"
        - "历史记录新增自动清理超期记录开关与保留天数设置，并支持按所选时间范围批量删除"
        - "支持隐藏论坛、新闻导航项，让导航栏更简洁"
        - "新增默认/自动播放速度设置"
        - "下载路径支持选择外置 SD/TF 卡作为自定义存储位置"
        - "（桌面端）恢复“记住上次音量”选项"
        - "作者主页操作按钮改为图标+文字胶囊样式；首页退出增加二次确认"
        - "优化了 iOS 用户在部分页面里的返回操作体验"
        - "补齐安卓 launcher 自适应图标，适配国内圆形图标遮罩"
        - "优化用户网络体验"
        - "修复了视频预览弹窗不能显示的问题"
        - "修复作者主页视频数恒显示 21 的错误"
        - "修复 Windows 端应用内全屏时页面显示异常的问题"
        - "启动时强制进入主站而非记忆中的 AI 站，避免相关异常"
        - "修复嵌套返回导致的返回卡死、下载列表刷新竞态与重复项等问题"
        - "iOS 打包前对内嵌 framework 进行 ad-hoc 签名，修复 AltStore/SideStore 侧载报错"
        - "优化播放器触觉反馈（画面/进度横滑 seek 等），修复若干 bug 并提升整体稳定性"
      en:
        - "All in-app shortcuts are now customizable — reassign keys freely, with a new shortcuts settings page to manage them; long-pressing left/right in the player now enters continuous speed playback instead of only triggering a single fast-forward/rewind as before"
        - "Added zoom and rotate gestures for the player picture: pinch with two fingers on a trackpad/touchscreen, or hold Shift or Ctrl and scroll the mouse wheel, to zoom and rotate the picture"
        - "Added per-player screen fit modes (Fit / Stretch / Fill / 16:9 / 4:3) that apply only to the current player"
        - "Added a color-vision assist filter to both the player and the gallery, each with its own independent switch, offering three color-blindness/color-weakness modes"
        - "On narrow portrait screens you can now swipe up during playback to shrink the player to its minimum height"
        - "Oreno3d and iwara tags now both support localization toggling, long-press for details, and a copy & translation-correction feedback dialog"
        - "The download list now supports custom categories, choosing a category when downloading, and preserving scroll position after deletion"
        - "Downloads support batch deletion by date range / N days ago; the completion toast moved to the bottom and is tappable to jump; list items scale proportionally to screen width for a more compact small-screen layout"
        - "Improved the search dialog layout (Oreno3D entry / Google search / history confirmation) and allowed keyword-less browsing using only filters and sorting"
        - "The search results page now supports saving and restoring search conditions"
        - "Popular video/gallery filters gained a persistent entry and quick favorite-tag filtering"
        - "AI translation now supports multiple providers (OpenAI and compatible endpoints / Anthropic / Google native), with streaming output and collapsible reasoning; you can choose a provider preset and fetch the model list in settings"
        - "Added local content blocking: hide videos and galleries by keyword, regular expression, or author user ID; rules are stored locally (and included in the settings backup) with separate import/export for block rules, and blocked cards show a frosted mask that can be revealed temporarily"
        - "Time codes in video descriptions and comments (e.g. 1:23, 1:23:45) are now highlighted and tappable to jump straight to that point"
        - "Added a one-time gesture guide the first time you open a video detail page"
        - "Watch history gained an auto-cleanup toggle with a retention-days setting, and supports deleting records within a selected date range"
        - "You can now hide the Forum and News navigation items for a cleaner navigation bar"
        - "Added a default / auto playback speed setting"
        - "Custom download path now supports external SD/TF cards as the storage location"
        - "(Desktop) Restored the \"remember last volume\" option"
        - "Author profile action buttons changed to labeled icon+text pills; exiting from the home root now asks for confirmation"
        - "Improved the back-navigation experience for iOS users on some pages"
        - "Added Android adaptive launcher icons to fit circular icon masks used by some regional ROMs"
        - "Improved the user network experience"
        - "Fixed an issue where the video preview popup could not be displayed"
        - "Fixed the author profile showing a bogus video count stuck at 21"
        - "Fixed a page rendering issue when entering in-app fullscreen on Windows"
        - "On startup the app now always enters the main site instead of the remembered AI site, avoiding related issues"
        - "Fixed back-navigation deadlocks caused by nested back interception, and download-list refresh races and duplicates"
        - "Ad-hoc signed the embedded frameworks before packaging on iOS, fixing AltStore/SideStore sideload errors"
        - "Improved player haptic feedback (screen/progress horizontal-swipe seek, etc.), fixed several bugs, and improved overall stability"
      ja:
        - "アプリ内のすべてのショートカットをカスタマイズ可能にし、キーを自由に再割り当てできるようになりました（管理用のショートカット設定ページも追加）。プレイヤーで左右を長押しすると、従来のように早送り/巻き戻しが一度だけ発動するのではなく、そのまま倍速再生に入るようになりました"
        - "プレイヤー画面にズーム・回転ジェスチャーを追加：トラックパッド/タッチスクリーンでは2本指ピンチ、マウスでは Shift または Ctrl + ホイールで、画面の拡大・縮小・回転が可能に"
        - "プレイヤーに画面サイズ調整（フィット/ストレッチ/フィル/16:9/4:3、現在のプレイヤーのみに適用）を追加"
        - "プレイヤーとギャラリーの両方に色覚補助フィルターを追加（それぞれ独立したスイッチ）し、3段階の色覚異常/色弱補助モードを提供"
        - "ナロー縦画面の再生中に上スワイプでプレイヤーを最小の高さまで収縮できるようにしました"
        - "Oreno3d と iwara のタグがいずれもローカライズ切り替え、長押しで詳細表示、コピーおよび翻訳修正フィードバックに対応"
        - "ダウンロード一覧にカスタムカテゴリを追加し、ダウンロード時にカテゴリを選択可能、削除後もスクロール位置を維持"
        - "ダウンロードで日付範囲/N日前による一括削除に対応。完了通知を下部に移動しタップで遷移可能に。リスト要素を画面幅に応じて等比縮小し小画面でよりコンパクトに"
        - "検索ダイアログのレイアウトを改善（Oreno3D 入口/Google 検索/履歴確認）し、キーワードなしでもフィルターと並べ替えだけで閲覧可能に"
        - "検索結果ページで検索条件の保存と復元に対応"
        - "人気動画/ギャラリーのフィルターに常設入口とお気に入りタグのクイックフィルターを追加"
        - "AI 翻訳が複数プロバイダー（OpenAI および互換エンドポイント / Anthropic / Google ネイティブ）に対応。ストリーミング出力と思考過程の折りたたみ表示に対応し、設定でプロバイダープリセットの選択とモデル一覧の取得が可能になりました"
        - "ローカルコンテンツブロックを追加：キーワード・正規表現・作者ユーザーIDで動画やギャラリーを非表示にできます。ルールはローカル保存（設定バックアップに含む）で、ブロックルールの個別インポート/エクスポートにも対応。ブロックされたカードはすりガラス表示となり一時的に表示できます"
        - "動画の説明文やコメント内のタイムコード（例：1:23、1:23:45）を自動でハイライトし、タップでその再生位置へジャンプできるようにしました"
        - "動画詳細ページを初めて開いたときに、一度だけ操作ジェスチャーのガイドを表示するようにしました"
        - "履歴に期限切れ記録の自動クリーンアップスイッチと保持日数設定を追加し、選択した期間内の記録の一括削除にも対応しました"
        - "フォーラム・ニュースのナビゲーション項目を非表示にでき、ナビゲーションバーをすっきりさせられます"
        - "デフォルト/自動再生速度の設定を追加"
        - "ダウンロード先として外部 SD/TF カードをカスタム保存場所に選べるようにしました"
        - "（デスクトップ）「前回の音量を記憶」オプションを復元しました"
        - "作者プロフィールの操作ボタンをアイコン+テキストのピル型に変更。ホームのルートから終了する際に確認を追加"
        - "一部ページでの iOS ユーザーの戻る操作の体験を改善しました"
        - "Android のランチャー用アダプティブアイコンを追加し、一部地域 ROM の円形アイコンマスクに対応"
        - "ユーザーのネットワーク体験を最適化"
        - "動画プレビューのポップアップが表示されない問題を修正"
        - "作者プロフィールの動画数が誤って常に21と表示される問題を修正"
        - "Windows でアプリ内フルスクリーンにした際にページ表示が乱れる問題を修正"
        - "起動時に記憶された AI サイトではなく常にメインサイトに入るようにし、関連する不具合を回避"
        - "ネストした戻る制御によるデッドロック、ダウンロード一覧の更新競合と重複などの問題を修正"
        - "iOS でパッケージ前に埋め込みフレームワークへ ad-hoc 署名を行い、AltStore/SideStore のサイドロードエラーを修正"
        - "プレイヤーの触覚フィードバック（画面/進捗の横スワイプシークなど）を改善し、いくつかの不具合を修正して全体の安定性を向上"
