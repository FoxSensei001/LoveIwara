pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        // CI（GitHub Actions 等境外环境）跳过阿里云镜像，直接用官方源。
        // 阿里云镜像偶发 502，且 Gradle 对 5xx 不会回退到后续仓库而是直接失败；
        // 本地（国内）仍优先用阿里云镜像提速。
        if (System.getenv("CI") != "true") {
            maven { url 'https://maven.aliyun.com/repository/google' }
            maven { url 'https://maven.aliyun.com/repository/public' }
        }
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.13.0" apply false
    id "org.jetbrains.kotlin.android" version "2.3.20" apply false
    // Compose 编译器插件。只有 quest 变体真的写 Compose（空间控制条用官方
    // Meta Horizon OS UI Set），但 `buildFeatures.compose` 是模块级的、没有 per-flavor 开关。
    // standard 变体因为没有任何 Compose 依赖与 @Composable 代码，产物不受影响。
    // 版本必须与 KGP 一致（Kotlin 2.x 起 Compose 编译器随 Kotlin 发版）。
    id "org.jetbrains.kotlin.plugin.compose" version "2.3.20" apply false
}

include ":app"
