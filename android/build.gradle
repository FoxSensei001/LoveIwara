// ⛔ 这个 buildscript 块只为一件事存在：Meta Spatial SDK 的 gradle 插件。
//
// 它会把 `kotlin-compiler-embeddable`（2.1.x）拖进**构建类路径**，和本项目的
// KGP（settings.gradle 里锁的 2.3.20）自带的编译器打架 ——
// 症状是 K2JVMCompilerArguments 的方法签名对不上，Kotlin 编译整个起不来。
// 唯一稳妥的修法是在 classpath 上直接排除它（spike 里已验证过这条）。
//
// 插件本身走 legacy 的 buildscript + apply plugin，而不是 settings.gradle 的
// plugins DSL：exclude 只能作用在 buildscript 的 classpath 配置上，
// 用 plugins DSL 就够不着这个口子。
buildscript {
    repositories {
        if (System.getenv("CI") != "true") {
            maven { url 'https://maven.aliyun.com/repository/google' }
            maven { url 'https://maven.aliyun.com/repository/public' }
        }
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath "com.meta.spatial.plugin:com.meta.spatial.plugin.gradle.plugin:0.13.2"
    }
    configurations.classpath {
        exclude group: "org.jetbrains.kotlin", module: "kotlin-compiler-embeddable"
    }
}

allprojects {
    repositories {
        // CI（GitHub Actions 等境外环境）跳过阿里云镜像，直接用官方源。
        // 阿里云镜像偶发 502，且 Gradle 对 5xx 不会回退到后续仓库而是直接失败；
        // 本地（国内）仍优先用阿里云镜像提速。
        if (System.getenv("CI") != "true") {
            maven { url 'https://maven.aliyun.com/repository/google' }
            maven { url 'https://maven.aliyun.com/repository/public' }
        }
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"

    // 部分插件仍写死较低的 compileSdk（如 irondash_engine_context 0.5.5 写死 31），
    // 但其 AndroidX 传递依赖要求 34+，AGP 8.13 的 AAR 元数据校验会直接判失败。
    // 这里把过低的插件抬到与 app 一致；compileSdk 只影响编译期可用 API，
    // 不改变 minSdk/targetSdk 的运行时行为。
    // 只抬升、不降级：permission_handler_android 14 自己要求 compileSdk 37，
    // 若固定成统一值会把它降下来导致找不到 Android 17 的新符号。
    // 注意：必须在 evaluationDependsOn(":app") 之前注册，否则 :app 已被求值会抛
    // "Cannot run Project.afterEvaluate(Closure) when the project is already evaluated"。
    if (project.name != "app") {
        afterEvaluate {
            if (project.hasProperty("android") && project.android.compileSdk != null
                    && project.android.compileSdk < 36) {
                project.android.compileSdk = 36
            }
        }
    }

    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
