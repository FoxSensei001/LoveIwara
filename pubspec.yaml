name: i_iwara
description: "A new Flutter project."

# Prevent accidental publishing to pub.dev.
publish_to: 'none'

version: 0.5.1+3

environment:
  sdk: ^3.8.0
  flutter: 3.47.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  get: ^5.0.0-release-candidate-9.2.1
  go_router: ^17.5.0
  window_manager: ^0.5.0
  crypto: ^3.0.6
  cryptography: ^2.7.0
  win32: ^5.14.0
  # 桌面端自动探测外部播放器要读注册表（App Paths / 卸载项 / Steam / Oculus 库），
  # 见 desktop_player_probe.dart。此前一直是传递依赖，现在直接用它，提为直接依赖。
  win32_registry: ^2.1.0
  logger: ^2.5.0
  flutter_secure_storage: ^10.0.0
  get_storage: ^2.1.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  extended_nested_scroll_view: ^6.2.1
  markdown_widget: ^2.3.2+8
  url_launcher: ^6.3.1
  flutter_animate: ^4.5.2
  photo_view: ^0.15.0
  flutter_svg: ^2.2.1
  super_clipboard: ^0.9.1
  file_selector: ^1.0.3
  sqlite3: ^3.1.6
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.5
  path: ^1.9.1
  loading_more_list: ^7.1.0
  waterfall_flow: ^3.1.1
  share_plus: ^12.0.1
  # slang 三件套精确锁定：4.13+ 生成类名改为 Translations$xxx$en，
  # 与仓库内已生成的 strings*.g.dart 及其手写引用不兼容，升级需同步迁移
  slang: 4.12.1
  slang_flutter: 4.12.1
  dynamic_color: ^1.7.0
  toastification: ^3.2.0
  app_links: ^7.0.0
  floating: ^6.0.0
  flutter_file_dialog: ^3.0.2
  # 13.x 的 permission_handler_android 14 要求 compileSdk 37（Android 17 的
  # ACCESS_LOCAL_NETWORK / CINNAMON_BUN 符号），本机与 CI 目前均停在 36。
  # 待 Android SDK 37 就位后可解锁。
  permission_handler: ^12.0.1
  visibility_detector: ^0.4.0+2
  yaml: ^3.1.3
  screen_brightness: ^2.1.4
  android_intent_plus: ^6.0.0
  flutter_displaymode: ^0.7.0
  qr_flutter: ^4.1.0
  open_file: ^4.0.0
  flutter_colorpicker: ^1.1.0
  archive: ^4.0.9
  ffi: ^2.2.0
  volume_controller: ^3.4.1
  battery_plus: ^7.0.0
  uuid: ^4.5.3
  # 17.0.0 起适配 Flutter 3.44+：16.x 内嵌的 editable_text 副本引用了已移除的
  # ExtendSelectionByPageIntent，在 3.47 上无法编译。
  extended_text_field: ^17.0.0
  dlna_dart: ^0.1.0
  tutorial_coach_mark: ^1.3.1
  connectivity_plus: 7.0.0
  network_info_plus: ^7.0.0
  swipeable_page_route: ^0.4.0

  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7

#  flutter_inappwebview: ^6.1.5
  dio: ^5.9.1
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.3.0
  cloudflare_interceptor: ^0.0.3
#  native_dio_adapter: ^1.4.0
  html: ^0.15.6
  desktop_drop: ^0.7.0

  device_info_plus: ^11.5.0
  dartantic_ai: ^3.4.1
  flutter_local_notifications: ^22.0.1
  local_notifier: ^0.1.6
  liquid_glass_easy: ^4.1.1
  liquid_glass_widgets: ^0.30.2
  local_auth: ^3.0.2
  local_auth_android: ^2.0.8
dev_dependencies:
  flutter_test:
    sdk: flutter
  slang_build_runner: 4.12.1 # 与 slang 同步锁定
  build_runner: ^2.11.1
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^6.0.0
  change_app_package_name: ^1.4.0

flutter_launcher_icons:
  android: true         # 为 Android 生成图标
  ios: true             # 为 iOS 生成图标
  image_path: "assets/icon/launcher_icon_v2.png"  # 图标的路径
  # 自适应图标（Android 8.0+ / 国内 ROM 的圆形遮罩靠它渲染）：满版橙色背景 + 满版橙底 logo 前景，
  # logo 位于画布 23%~77% 的安全区内，因此前景不做 inset，圆形遮罩下即为满版橙底居中 logo。
  adaptive_icon_background: "#F89032"
  adaptive_icon_foreground: "assets/icon/launcher_icon_v2.png"
  remove_alpha_ios: true  # （可选）去除 iOS 图标的透明度，避免上传到 App Store 时被拒绝
  windows:
    generate: true
    image_path: "assets/icon/launcher_icon_v2.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "assets/icon/launcher_icon_v2.png"
flutter:
  uses-material-design: true

  # Enable generation of localized Strings from arb files.
  generate: true

  assets:
    # Add assets from the images directory to the application.
    - assets/images/
    - assets/svg/
    - assets/icon/launcher_icon_v2.png
    - assets/anime4k_shaders/
    - assets/data/

dependency_overrides:
  js: ^0.7.1

license: MIT
