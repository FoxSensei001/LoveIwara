    mode_a_a_fast: "เวอร์ชันเร็วของ Mode A+A เน้นคุณภาพที่รับรู้ได้สูงขึ้นบนอุปกรณ์ที่มีข้อจำกัดด้านสมรรถนะ"
    mode_b_b_fast: "เวอร์ชันเร็วของ Mode B+B ให้การซ่อมแซมเส้นและการจัดการอาร์ติแฟกต์ที่ดีขึ้นสำหรับอุปกรณ์ที่มีข้อจำกัดด้านสมรรถนะ"
    mode_c_a_fast: "เวอร์ชันเร็วของ Mode C+A ประมวลผลแหล่งคุณภาพสูงได้อย่างรวดเร็วพร้อมให้การซ่อมแซมเส้นแบบเบา"
