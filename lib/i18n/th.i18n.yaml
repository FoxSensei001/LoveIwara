      pinch: "จีบนิ้ว"
      selectTitle: "ชี้และเลือก"
      selectBody: "เล็งลำแสงไปที่ปุ่ม จากนั้นกดแล้วปล่อยไกชี้ ใช้สำหรับเล่น ตั้งค่า และเลื่อนแถบเลื่อนบนแผงควบคุม"
      selectHint: "ไกชี้อยู่ด้านหลังของปุ่ม ปุ่มกริปที่ด้ามจับด้านในใช้สำหรับจับหน้าต่าง"
      panelTitle: "แสดงหรือซ่อนแผงควบคุม"
      panelBody: "ชี้ออกไปนอกแผงควบคุม จากนั้นแตะไกชี้เพื่อแสดงหรือซ่อน เมื่อใช้การติดตามมือ การจีบนิ้วสั้นๆ นอกแผงควบคุมจะให้ผลเช่นเดียวกัน"
      panelHint: "ใช้การแตะสั้นๆ โดยไม่ลาก การกดค้างแล้วขยับคือการลาก ไม่ใช่การสลับแผงควบคุม"
      playTitle: "เล่นและหยุดชั่วคราว"
      playBody: "ชี้ออกจากแผงควบคุมแล้วกดปุ่ม A ทางขวา หรือปุ่ม X ทางซ้ายเพื่อเล่นหรือหยุดชั่วคราว คุณยังสามารถเลือกปุ่มเล่นบนแผงควบคุมได้ด้วย"
      playHint: "สามารถปิดแป้นพิมพ์ลัดเริ่มต้นนี้ได้ในการตั้งค่าเครื่องเล่นเชิงพื้นที่ เมื่อชี้ไปที่แผงควบคุม การป้อนข้อมูลจะส่งไปยังแผงควบคุม"
      seekTitle: "เลื่อนตำแหน่งด้วยก้านอนาล็อก"
      seekBody: "ดันก้านอนาล็อกไปทางซ้ายหรือขวาเพื่อข้ามทีละ 5 วินาที ดันค้างไว้เพื่อเลื่อนเร็วขึ้นพร้อมดูตัวอย่างเวลา ปล่อยเพื่อไปยังตำแหน่งที่เลือก"
      seekHint: "อย่าให้ลำแสงของคอนโทรลเลอร์นั้นชี้ไปที่แผงควบคุม หากก้านอนาล็อกชี้ไปที่แผงควบคุมจะเป็นการเลื่อนแผงแทน"
      browseTitle: "เรียกดูด้วยก้านอนาล็อก"
      browseBody: "ขยับก้านอนาล็อกข้างใดก็ได้ไปทางซ้ายหรือขวาเพื่อดูรายการก่อนหน้าหรือถัดไป ดันค้างไว้เพื่อเรียกดูต่อเนื่อง คุณยังสามารถเลือกภาพขนาดย่อในแถบฟิล์มได้ด้วย"
      browseHint: "วิดีโอในแกลเลอรีก็ถือเป็นรายการเช่นกัน การชี้ไปที่แผงควบคุมจะทำให้ก้านอนาล็อกเลื่อนเนื้อหาในแผงแทน"
      swipeTitle: "ลากเพื่อพลิกหน้า"
      swipeBody: "เล็งไปที่รูปภาพ กดไกชี้ค้างไว้แล้วลากไปทางซ้าย ปล่อยหลังจากมีสัญญาณเปลี่ยนหน้าเพื่อไปข้างหน้า ลากไปทางขวาเพื่อย้อนกลับ การจีบนิ้วแล้วลากก็ใช้ได้เช่นกัน"
      swipeHint: "รูปภาพต้องอยู่ที่ขนาด 1× จึงจะเปลี่ยนหน้าด้วยการลากได้ วิดีโอในแกลเลอรีก็รองรับเช่นกัน หน้าจอจะอยู่นิ่งจนกว่าคุณจะปล่อย"
      zoomTitle: "ซูมดูรายละเอียดรูปภาพ"
      zoomBody: "เล็งไปที่รายละเอียดในภาพ กดไกชี้ค้างไว้ แล้วดันก้านอนาล็อกขึ้นเพื่อซูมเข้า หรือลงเพื่อซูมออก การซูมจะยึดตำแหน่งที่คุณกดไว้"
      zoomHint: "การดำเนินการนี้จะขยายรูปภาพภายในหน้าต่าง หากไม่ได้จับรูปภาพไว้ การดันขึ้น/ลงจะเป็นการปรับระยะการมอง"
      panTitle: "เลื่อนและคืนค่ารูปภาพ"
      panBody: "เมื่อซูมเข้าแล้ว ให้กดไกชี้ค้างไว้แล้วลากเพื่อดูรอบๆ แตะสองครั้งที่รูปภาพเพื่อซูมเป็น 2.5× หรือคืนค่าเดิม สำหรับมือ ให้จีบนิ้วสองครั้งอย่างรวดเร็ว"
      panHint: "การลากจะเป็นการเลื่อนดูภาพที่ซูมอยู่ คืนค่าเป็น 1× ก่อนลากเพื่อเปลี่ยนหน้า"
      slideshowTitle: "เริ่มการฉายสไลด์"
      slideshowBody: "เมื่อดูรูปภาพ กดปุ่ม A / X เพื่อเริ่มหรือหยุดการฉายสไลด์ชั่วคราว แผงควบคุมมีช่วงเวลา 3, 5, 10 หรือ 20 วินาที และคุณภาพของภาพแบบมาตรฐานหรือต้นฉบับ"
      slideshowHint: "ในวิดีโอของแกลเลอรี ปุ่ม A / X จะควบคุมการเล่นของวิดีโอนั้น ต้องเปิดใช้งานปุ่มลัดของคอนโทรลเลอร์ในการตั้งค่าก่อน"
      moveTitle: "จับและย้ายหน้าจอ"
      moveBody: "กดปุ่มกริปที่ด้ามจับด้านในค้างไว้ ขยับคอนโทรลเลอร์เพื่อจัดตำแหน่งหน้าจอ จากนั้นจึงปล่อย ขณะรับชม คุณสามารถจับหน้าจอได้โดยไม่ต้องเล็งไปที่หน้าจอ"
      moveHint: "การเล็งไปที่หน้าต่างแอปหรือแผงควบคุมจะจับหน้าต่างนั้นก่อน ในวิดีโอแบบพาโนรามา การจับจะใช้ปรับทิศทางการมอง"
      scaleTitle: "ปรับขนาดด้วยสองมือ"
      scaleBody: "กดปุ่มกริปทั้งสองข้างค้างไว้ กางมือออกเพื่อขยายหน้าจอ หรือดึงมือเข้าหากันเพื่อย่อหน้าจอ เมื่อใช้การติดตามมือ ให้จีบนิ้วค้างไว้ทั้งสองมือ"
      scaleHint: "สำหรับหน้าจอแบนหรือโค้ง รวมถึงเวทีแกลเลอรี อย่าให้ลำแสงชี้ไปที่แผงควบคุม การทำเช่นนี้จะปรับขนาดของทั้งหน้าจอ"
      distanceTitle: "ปรับระยะการมอง"
      distanceBody: "ดันก้านอนาล็อกขึ้นเพื่อเลื่อนหน้าจอออกไปไกลขึ้น หรือดันลงเพื่อดึงเข้ามาใกล้ขึ้น ขณะจับหน้าต่าง การดันขึ้น/ลงจะเลื่อนหน้าต่างนั้น ปรับระดับเสียงได้ที่แผงควบคุม"
      distanceHint: "ชี้ออกจากแผงควบคุม การจับรูปภาพไว้จะเปลี่ยนการดันขึ้น/ลงเป็นการซูมรูปภาพ ส่วนวิดีโอพาโนรามาจะปรับมุมมองแทน"
      resizeTitle: "ใช้ขอบและมุม"
      resizeBody: "กรอบจะสว่างขึ้นเมื่อลำแสงของคุณเข้าใกล้ขอบ กดไกชี้ค้างไว้หรือจีบนิ้วที่ขอบเพื่อย้ายหน้าต่าง ลากมุมเพื่อปรับขนาด"
      resizeHint: "ใช้ได้กับหน้าต่างแอป แผงควบคุม และหน้าจอ หน้าต่างแอปสามารถปรับความกว้างและความสูงได้ ส่วนหน้าจอจะรักษาอัตราส่วนภาพไว้"
      navigationTitle: "ย้อนกลับและเปิดการตั้งค่า"
      navigationBody: "ปุ่ม B / Y ใช้ย้อนกลับหนึ่งระดับ: ปิดป๊อปอัปหรือกลับสู่หน้าแรกของแผงควบคุม ซ่อนแผงควบคุม แล้วกลับสู่แอป ปุ่ม Menu ด้านซ้ายเปิดการตั้งค่าเชิงพื้นที่"
      navigationHint: "ปุ่ม Meta ด้านขวาเป็นของระบบ การตั้งศูนย์ระบบใหม่จะนำมุมมองกลับมาอยู่ข้างหน้าโดยยังคงขนาดและระยะห่างของหน้าจอไว้"
      handsTitle: "ใช้มือของคุณ"
      handsBody: "เมื่อเปิดใช้งานการติดตามมือ ให้เล็งลำแสงของระบบไปที่ปุ่ม จีบนิ้วหัวแม่มือและนิ้วชี้เข้าหากัน แล้วปล่อย ใช้แผงควบคุมสำหรับการเล่น การเลื่อนหาตำแหน่ง และการนำทางแกลเลอรี"
      handsHint: "จีบนิ้วนอกจากแผงควบคุมเพื่อเปิด/ปิดแผง จีบนิ้วที่ขอบเพื่อย้าย ที่มุมเพื่อปรับขนาด หรือจีบนิ้วทั้งสองมือแล้วกางออกเพื่อขยายหน้าจอ"
