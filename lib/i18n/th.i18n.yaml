    upscale_deblur_fast: "การขยายภาพและลดความเบลอแบบเร็วด้วยอัลกอริทึมดั้งเดิมที่ไม่ใช้ CNN ดีกว่าอัลกอริทึมเริ่มต้นของโปรแกรมเล่นด้วยภาระที่ต่ำมาก"
    restore_s_only: "ซ่อมแซมเท่านั้นโดยใช้โมเดล CNN ที่เร็วที่สุด ไม่ขยายภาพ เหมาะกับการเล่นที่ความละเอียดแท้ที่ต้องการเพิ่มคุณภาพ"
    denoise_bilateral_fast: "การลดสัญญาณรบกวนแบบเร็วด้วยตัวกรอง bilateral แบบดั้งเดิม เร็วมาก เหมาะกับการจัดการสัญญาณรบกวนเล็กน้อย"
    upscale_non_cnn: "การขยายภาพแบบเร็วด้วยอัลกอริทึมดั้งเดิม ภาระต่ำมาก ดีกว่าค่าเริ่มต้นของโปรแกรมเล่น"
    mode_a_fast_darken: "Mode A (Fast) + การทำให้เส้นเข้มขึ้น เพิ่มเอฟเฟกต์ทำให้เส้นเข้มขึ้นบน Mode A แบบเร็ว เพื่อให้เส้นเด่นชัดและมีสไตล์ยิ่งขึ้น"
    mode_a_hq_thin: "Mode A (HQ) + การทำให้เส้นบางลง เพิ่มเอฟเฟกต์ทำให้เส้นบางลงบน Mode A คุณภาพสูง เพื่อให้ดูประณีตยิ่งขึ้น"
