# Anime4K Settings
anime4k:
  realTimeVideoUpscalingAndDenoising: "Escalado y eliminación de ruido de vídeo en tiempo real, mejorando la calidad del vídeo de animación"
  settings: "Ajustes de Anime4K"
  preset: "Preajuste de Anime4K"
  disable: "Desactivar Anime4K"
  disableDescription: "Desactivar los efectos de mejora de vídeo"
  highQualityPresets: "Preajustes de alta calidad"
  fastPresets: "Preajustes rápidos"
  litePresets: "Preajustes ligeros"
  moreLitePresets: "Preajustes más ligeros"
  customPresets: "Preajustes personalizados"
  presetGroups:
    highQuality: "Alta calidad"
    fast: "Rápido"
    lite: "Ligero"
    moreLite: "Más ligero"
    custom: "Personalizado"
  presetDescriptions:
    mode_a_hq: "Adecuado para la mayoría de animaciones en 1080p, sobre todo las que presentan desenfoque, remuestreo y artefactos de compresión. Ofrece la mayor calidad percibida."
    mode_b_hq: "Adecuado para animaciones con un ligero desenfoque o efecto de anillo causado por el escalado. Reduce eficazmente el efecto de anillo y el aliasing."
    mode_c_hq: "Adecuado para fuentes de alta calidad (como animaciones o películas nativas en 1080p). Elimina el ruido y ofrece el PSNR más alto."
    mode_a_a_hq: "Versión mejorada del modo A que ofrece la máxima calidad percibida y puede reconstruir casi todas las líneas degradadas. Puede provocar un exceso de nitidez o efecto de anillo."
    mode_b_b_hq: "Versión mejorada del modo B, que ofrece mayor calidad percibida, optimiza aún más las líneas y reduce los artefactos."
    mode_c_a_hq: "Versión del modo C con calidad percibida mejorada, que mantiene un PSNR alto y trata de reconstruir parte del detalle de las líneas."
    mode_a_fast: "Versión rápida del modo A que equilibra calidad y rendimiento; adecuada para la mayoría de animaciones en 1080p."
    mode_b_fast: "Versión rápida del modo B para tratar artefactos leves y efecto de anillo con un menor consumo."
    mode_c_fast: "Versión rápida del modo C, para eliminar ruido y escalar rápidamente fuentes de alta calidad."
    mode_a_a_fast: "Versión rápida del modo A+A, que busca una mayor calidad percibida en dispositivos con rendimiento limitado."
    mode_b_b_fast: "Versión rápida del modo B+B, que ofrece una reparación de líneas y un procesamiento de artefactos mejorados para dispositivos con rendimiento limitado."
    mode_c_a_fast: "Versión rápida del modo C+A, que procesa rápidamente fuentes de alta calidad y aporta una reparación ligera de líneas."
    upscale_only_s: "Escalado x2 ultrarrápido usando solo el modelo CNN más rápido, sin reparación ni eliminación de ruido y con un consumo mínimo."
    upscale_deblur_fast: "Escalado y reducción de desenfoque rápidos mediante algoritmos tradicionales sin CNN; mejores que los del reproductor predeterminado y con un consumo muy bajo."
    restore_s_only: "Solo reparación con el modelo CNN más rápido, sin escalado. Adecuado para reproducir en resolución nativa cuando se desea mejorar la calidad."
    denoise_bilateral_fast: "Eliminación de ruido rápida mediante filtrado bilateral tradicional; muy veloz y adecuada para tratar ruido leve."
    upscale_non_cnn: "Escalado rápido con algoritmos tradicionales, con un consumo muy bajo y mejor que los ajustes predeterminados del reproductor."
    mode_a_fast_darken: "Modo A (rápido) + oscurecimiento de líneas, que añade este efecto sobre el modo A rápido para lograr líneas más marcadas y estilizadas."
    mode_a_hq_thin: "Modo A (alta calidad) + adelgazamiento de líneas, que añade este efecto sobre el modo A de alta calidad para un aspecto más fino."
  presetNames:
    mode_a_hq: "Mode A (HQ)"
    mode_b_hq: "Mode B (HQ)"
    mode_c_hq: "Mode C (HQ)"
    mode_a_a_hq: "Mode A+A (HQ)"
    mode_b_b_hq: "Mode B+B (HQ)"
    mode_c_a_hq: "Mode C+A (HQ)"
    mode_a_fast: "Mode A (Fast)"
    mode_b_fast: "Mode B (Fast)"
    mode_c_fast: "Mode C (Fast)"
    mode_a_a_fast: "Mode A+A (Fast)"
    mode_b_b_fast: "Mode B+B (Fast)"
    mode_c_a_fast: "Mode C+A (Fast)"
    upscale_only_s: "Escalado con CNN (ultrarrápido)"
    upscale_deblur_fast: "Escalado y reducción de desenfoque (rápido)"
    restore_s_only: "Restauración (ultrarrápida)"
    denoise_bilateral_fast: "Eliminación de ruido bilateral (ultrarrápida)"
    upscale_non_cnn: "Escalado sin CNN (ultrarrápido)"
    mode_a_fast_darken: "Modo A (rápido) + oscurecimiento de líneas"
    mode_a_hq_thin: "Modo A (alta calidad) + adelgazamiento de líneas"
  performanceTip: "💡 Sugerencia: elija los preajustes adecuados según el rendimiento de su dispositivo. En dispositivos de gama baja se recomienda usar preajustes ligeros."
  compatibilityTip: "⚠️ Algunas GPU móviles (p. ej. Kirin 980 / Mali-G76) no pueden renderizar ningún sombreador personalizado. Si la imagen se pone negra mientras el audio sigue reproduciéndose, desactive Anime4K aquí."
