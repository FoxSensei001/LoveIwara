      panelHint: "Use un toque corto sin arrastrar. Mantener y mover es un arrastre, no un cambio del panel."
      playTitle: "Reproducir y pausar"
      playBody: "Apunte fuera del panel de control y pulse A en el derecho o X en el izquierdo para reproducir o pausar. También puede seleccionar el botón de reproducir del panel."
      playHint: "Este atajo predeterminado puede desactivarse en los ajustes del reproductor espacial. Al apuntar al panel, la entrada va al panel."
      seekTitle: "Desplazarse con el joystick"
      seekBody: "Mueva cualquiera de los joysticks a izquierda o derecha para un salto de 5 segundos. Manténgalo para desplazarse más rápido mientras previsualiza el tiempo objetivo. Suelte para confirmar la búsqueda."
      seekHint: "Mantenga el rayo de ese controlador fuera del panel de control. Un joystick que apunta al panel desplaza el panel en su lugar."
      browseTitle: "Navegar con el joystick"
      browseBody: "Mueva cualquiera de los joysticks a izquierda o derecha para el elemento anterior o siguiente; mantenga para seguir navegando. También puede seleccionar una miniatura en la tira de película."
      browseHint: "Los videos de una galería también son elementos. Apuntar al panel de control hace que el joystick desplace el panel."
      swipeTitle: "Arrastrar a lo ancho para pasar de página"
      swipeBody: "Apunte a la imagen, mantenga el gatillo índice y arrastre a la izquierda. Suelte tras la señal de cambio de página para avanzar; arrastre a la derecha para retroceder. También funciona pellizcar y arrastrar."
      swipeHint: "Las imágenes deben estar a 1× para pasar páginas arrastrando. Los videos de galería también lo admiten. El escenario permanece inmóvil hasta que suelte."
      zoomTitle: "Ampliar la imagen"
      zoomBody: "Apunte a un detalle de la imagen, mantenga el gatillo índice y luego empuje el joystick hacia arriba para ampliar o hacia abajo para reducir. El zoom se fija donde pulsó."
      zoomHint: "Esto amplía la imagen dentro de su ventana. Sin mantener la imagen, arriba/abajo ajusta la distancia de visualización."
      panTitle: "Desplazar y restaurar la imagen"
      panBody: "Una vez ampliada, mantenga el gatillo índice y arrastre para mirar alrededor. Toque dos veces la imagen para ampliarla a 2,5× o restaurarla. Con las manos, pellizque dos veces rápido."
      panHint: "Arrastrar desplaza una imagen ampliada. Restaure a 1× antes de arrastrar para pasar páginas."
      slideshowTitle: "Iniciar una presentación"
      slideshowBody: "En una imagen, A / X inicia o pausa la presentación. El panel ofrece intervalos de 3, 5, 10 o 20 segundos y calidad de imagen estándar u original."
      slideshowHint: "En un video de galería, A / X controla la reproducción de ese video. El atajo del controlador debe estar activado en los ajustes."
      moveTitle: "Agarrar y mover la pantalla"
      moveBody: "Mantenga el botón de agarre en el asa interior, mueva el controlador para colocar la pantalla y suelte. Mientras ve, puede agarrar la pantalla sin apuntar a ella."
      moveHint: "Apuntar a la ventana de la aplicación o al panel de control agarra esa ventana primero. En video panorámico, agarrar ajusta la orientación."
      scaleTitle: "Redimensionar con ambas manos"
      scaleBody: "Mantenga ambos botones de agarre. Separe las manos para ampliar la pantalla o júntelas para reducirla. Con el seguimiento de manos, mantenga un pellizco en ambas manos."
      scaleHint: "Para pantallas planas o curvas, incluido el escenario de la galería. Mantenga los rayos fuera del panel de control. Esto redimensiona toda la pantalla."
      distanceTitle: "Ajustar la distancia de visualización"
      distanceBody: "Empuje el joystick hacia arriba para alejar la pantalla o hacia abajo para acercarla. Mientras agarra una ventana, arriba/abajo mueve esa ventana. Ajuste el volumen en el panel."
      distanceHint: "Apunte fuera del panel de control. Mantener una imagen cambia arriba/abajo a zoom de imagen; los videos panorámicos ajustan la vista."
      resizeTitle: "Usar los bordes y las esquinas"
      resizeBody: "El marco se ilumina a medida que el rayo se acerca a un borde. Mantenga el gatillo o pellizque en un borde para mover la ventana; arrastre una esquina para redimensionarla."
      resizeHint: "Funciona en la ventana de la aplicación, el panel de control y la pantalla. La ventana de la aplicación cambia de ancho y alto; las pantallas conservan su relación de aspecto."
      navigationTitle: "Volver y abrir los ajustes"
      navigationBody: "B / Y retrocede un nivel: cierra una ventana emergente o vuelve al inicio del panel, oculta el panel y luego vuelve a la aplicación. El botón Menú izquierdo abre los ajustes espaciales."
      navigationHint: "El botón Meta derecho pertenece al sistema. El recentrado del sistema devuelve la vista al frente conservando el tamaño y la distancia de la pantalla."
      handsTitle: "Use las manos"
      handsBody: "Con el seguimiento de manos activado, apunte el rayo del sistema a un botón, pellizque con el pulgar y el índice y suelte. Use el panel para la reproducción, la búsqueda y la navegación por la galería."
      handsHint: "Pellizque fuera para mostrar u ocultar el panel. Pellizque un borde para moverlo, una esquina para redimensionarlo, o pellizque con ambas manos y separe para ampliar la pantalla."
