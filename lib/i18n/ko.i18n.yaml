      panelTitle: "패널 표시 또는 숨기기"
      panelBody: "컨트롤 패널 바깥을 가리킨 뒤 검지 트리거를 탭하여 표시하거나 숨깁니다. 핸드 트래킹에서는 패널 바깥을 빠르게 집어도 같은 동작이 됩니다."
      panelHint: "끌지 않고 짧게 탭하세요. 누른 채 움직이면 드래그로 처리되어 패널 전환이 되지 않습니다."
      playTitle: "재생 및 일시정지"
      playBody: "컨트롤 패널에서 벗어난 곳을 가리키고 오른쪽 A 또는 왼쪽 X를 누르면 재생하거나 일시정지합니다. 패널의 재생 버튼을 선택해도 됩니다."
      playHint: "이 기본 단축키는 공간 플레이어 설정에서 비활성화할 수 있습니다. 패널을 가리키면 입력이 패널로 전달됩니다."
      seekTitle: "스틱으로 스크럽"
      seekBody: "어느 한 스틱을 좌우로 살짝 밀면 5초 단위로 이동합니다. 계속 누르면 목표 시간을 미리 보며 더 빠르게 스크럽합니다. 놓으면 탐색이 확정됩니다."
      seekHint: "해당 컨트롤러의 광선을 컨트롤 패널에서 벗어나게 유지하세요. 스틱이 패널을 가리키면 대신 패널이 스크롤됩니다."
      browseTitle: "스틱으로 탐색"
      browseBody: "어느 한 스틱을 좌우로 움직여 이전/다음 항목으로 이동합니다. 계속 누르면 계속 탐색합니다. 필름스트립에서 썸네일을 선택할 수도 있습니다."
      browseHint: "갤러리의 동영상도 항목입니다. 컨트롤 패널을 가리키면 스틱이 패널을 스크롤합니다."
      swipeTitle: "옆으로 끌어 페이지 넘기기"
      swipeBody: "이미지에 광선을 맞추고 검지 트리거를 누른 채 왼쪽으로 끄세요. 페이지 넘김 신호 후 놓으면 넘어가고, 오른쪽으로 끌면 뒤로 갑니다. 집어서 끌어도 됩니다."
      swipeHint: "이미지를 끌어 페이지를 넘기려면 1배 상태여야 합니다. 갤러리 동영상도 지원합니다. 놓을 때까지 스테이지는 그대로 유지됩니다."
      zoomTitle: "이미지 확대"
      zoomBody: "이미지의 세부 부분에 광선을 맞추고 검지 트리거를 누른 뒤 스틱을 위로 밀면 확대, 아래로 밀면 축소됩니다. 확대는 누른 지점을 기준으로 고정됩니다."
      zoomHint: "이미지 창 안의 이미지를 확대합니다. 이미지를 잡지 않은 상태에서는 위/아래가 시청 거리를 조정합니다."
      panTitle: "이미지 이동 및 복원"
      panBody: "확대한 후 검지 트리거를 누른 채 끌면 주변을 둘러볼 수 있습니다. 이미지를 두 번 탭하면 2.5배로 확대하거나 원래대로 되돌립니다. 손을 사용할 때는 빠르게 두 번 집으세요."
      panHint: "끌면 확대된 이미지가 이동합니다. 페이지를 넘기려면 1배로 되돌린 후 끌어야 합니다."
      slideshowTitle: "슬라이드쇼 시작"
      slideshowBody: "이미지에서 A / X는 슬라이드쇼를 시작하거나 일시정지합니다. 패널에서 3초, 5초, 10초, 20초 간격과 일반 또는 원본 화질을 선택할 수 있습니다."
      slideshowHint: "갤러리 동영상에서는 A / X가 해당 동영상의 재생을 제어합니다. 컨트롤러 단축키는 설정에서 활성화해야 합니다."
      moveTitle: "화면 잡고 이동"
      moveBody: "안쪽 핸들의 그립 버튼을 누르고 컨트롤러를 움직여 화면을 배치한 뒤 놓으세요. 시청 중에는 화면을 가리키지 않고도 잡을 수 있습니다."
      moveHint: "앱 창이나 컨트롤 패널을 가리키면 먼저 그 창을 잡습니다. 파노라마 동영상에서는 그립으로 방향을 조정합니다."
      scaleTitle: "양손으로 크기 조절"
      scaleBody: "양쪽 그립 버튼을 누르세요. 손을 벌리면 화면이 커지고, 모으면 작아집니다. 핸드 트래킹에서는 양손으로 집은 상태를 유지하세요."
      scaleHint: "갤러리 스테이지를 포함한 평면 및 곡면 화면에 적용됩니다. 광선은 컨트롤 패널에 두지 마세요. 화면 전체의 크기가 조절됩니다."
      distanceTitle: "시청 거리 조정"
      distanceBody: "스틱을 위로 밀면 화면이 멀어지고, 아래로 밀면 가까워집니다. 창을 잡고 있으면 위/아래로 그 창이 움직입니다. 볼륨은 패널에서 조절하세요."
      distanceHint: "컨트롤 패널에서 벗어난 곳을 가리키세요. 이미지를 잡고 있으면 위/아래가 이미지 확대/축소로 바뀌고, 파노라마 동영상은 대신 시야가 조정됩니다."
      resizeTitle: "가장자리와 모서리 사용"
      resizeBody: "광선이 가장자리에 가까워지면 프레임이 빛납니다. 가장자리에서 트리거를 누르거나 집으면 창이 이동하고, 모서리를 끌면 크기가 조절됩니다."
      resizeHint: "앱 창, 컨트롤 패널, 화면에서 작동합니다. 앱 창은 너비와 높이가 바뀌고, 화면은 화면 비율을 유지합니다."
      navigationTitle: "뒤로 가기 및 설정 열기"
      navigationBody: "B / Y는 한 단계 뒤로 갑니다: 팝업을 닫거나 패널 홈으로 돌아가고, 패널을 숨긴 다음 앱으로 돌아갑니다. 왼쪽 Menu 버튼은 공간 설정을 엽니다."
      navigationHint: "오른쪽 Meta 버튼은 시스템에 속합니다. 시스템 리센터는 화면 크기와 거리를 유지하면서 시야를 정면으로 되돌립니다."
      handsTitle: "손 사용하기"
      handsBody: "핸드 트래킹을 켜고 시스템 광선을 버튼에 맞춘 뒤 엄지와 검지를 집었다가 놓으세요. 재생, 탐색, 갤러리 이동은 패널을 사용하세요."
      handsHint: "패널 바깥을 집으면 패널이 전환됩니다. 가장자리를 집으면 이동, 모서리를 집으면 크기 조절, 양손으로 집고 벌리면 화면이 커집니다."
