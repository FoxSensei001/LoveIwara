# Anime4K Settings
anime4k:
  realTimeVideoUpscalingAndDenoising: "실시간 영상 업스케일링 및 노이즈 제거로 애니메이션 영상 화질 향상"
  settings: "Anime4K 설정"
  preset: "Anime4K 프리셋"
  disable: "Anime4K 끄기"
  disableDescription: "영상 향상 효과 끄기"
  highQualityPresets: "고품질 프리셋"
  fastPresets: "고속 프리셋"
  litePresets: "경량 프리셋"
  moreLitePresets: "초경량 프리셋"
  customPresets: "사용자 지정 프리셋"
  presetGroups:
    highQuality: "고품질"
    fast: "고속"
    lite: "경량"
    moreLite: "초경량"
    custom: "사용자 지정"
  presetDescriptions:
    mode_a_hq: "대부분의 1080p 애니메이션, 특히 블러, 리샘플링 및 압축 아티팩트를 처리하는 영상에 적합합니다. 가장 높은 체감 화질을 제공합니다."
    mode_b_hq: "스케일링으로 인한 약간의 블러나 링잉이 있는 애니메이션에 적합합니다. 링잉과 계단 현상을 효과적으로 줄일 수 있습니다."
    mode_c_hq: "고품질 소스(예: 네이티브 1080p 애니메이션 또는 영화)에 적합합니다. 노이즈를 제거하고 가장 높은 PSNR을 제공합니다."
    mode_a_a_hq: "Mode A의 강화 버전으로, 최상의 체감 화질을 제공하며 거의 모든 손상된 선을 복원할 수 있습니다. 과도한 선명화나 링잉이 발생할 수 있습니다."
    mode_b_b_hq: "Mode B의 강화 버전으로, 더 높은 체감 화질을 제공하며 선을 더 최적화하고 아티팩트를 줄입니다."
    mode_c_a_hq: "Mode C의 체감 화질 강화 버전으로, 높은 PSNR을 유지하면서 일부 선 디테일을 복원합니다."
    mode_a_fast: "Mode A의 고속 버전으로, 화질과 성능의 균형을 맞추며 대부분의 1080p 애니메이션에 적합합니다."
    mode_b_fast: "Mode B의 고속 버전으로, 낮은 부하로 가벼운 아티팩트와 링잉을 처리합니다."
    mode_c_fast: "Mode C의 고속 버전으로, 고품질 소스를 빠르게 노이즈 제거하고 업스케일링합니다."
    mode_a_a_fast: "Mode A+A의 고속 버전으로, 성능이 제한된 기기에서 더 높은 체감 화질을 추구합니다."
    mode_b_b_fast: "Mode B+B의 고속 버전으로, 성능이 제한된 기기에 향상된 선 복원과 아티팩트 처리를 제공합니다."
    mode_c_a_fast: "Mode C+A의 고속 버전으로, 고품질 소스를 빠르게 처리하면서 가벼운 선 복원을 제공합니다."
    upscale_only_s: "가장 빠른 CNN 모델만 사용한 초고속 x2 업스케일링으로, 복원과 노이즈 제거 없이 부하가 최소입니다."
    upscale_deblur_fast: "기존 비 CNN 알고리즘을 사용한 고속 업스케일링 및 디블러로, 매우 낮은 부하로 기본 플레이어 알고리즘보다 우수합니다."
    restore_s_only: "가장 빠른 CNN 모델만 사용해 복원하며 업스케일링은 하지 않습니다. 화질을 개선하고 싶은 네이티브 해상도 재생에 적합합니다."
    denoise_bilateral_fast: "기존 양방향 필터를 사용한 고속 노이즈 제거로, 매우 빠르며 가벼운 노이즈 처리에 적합합니다."
    upscale_non_cnn: "기존 알고리즘을 사용한 고속 업스케일링으로, 부하가 매우 낮고 플레이어 기본값보다 우수합니다."
