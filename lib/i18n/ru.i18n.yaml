# Anime4K Settings
anime4k:
  realTimeVideoUpscalingAndDenoising: "Масштабирование и шумоподавление видео в реальном времени для улучшения качества аниме"
  settings: "Настройки Anime4K"
  preset: "Пресет Anime4K"
  disable: "Отключить Anime4K"
  disableDescription: "Отключить эффекты улучшения видео"
  highQualityPresets: "Пресеты высокого качества"
  fastPresets: "Быстрые пресеты"
  litePresets: "Облегчённые пресеты"
  moreLitePresets: "Более облегчённые пресеты"
  customPresets: "Пользовательские пресеты"
  presetGroups:
    highQuality: "Высокое качество"
    fast: "Быстрый"
    lite: "Облегчённый"
    moreLite: "Более облегчённый"
    custom: "Пользовательский"
  presetDescriptions:
    mode_a_hq: "Подходит для большинства аниме в 1080p, особенно при наличии размытия, артефактов ресемплинга и сжатия. Обеспечивает наивысшее воспринимаемое качество."
    mode_b_hq: "Подходит для аниме с лёгким размытием или звоном, вызванным масштабированием. Эффективно снижает звон и алиасинг."
    mode_c_hq: "Подходит для качественных источников (например, нативных аниме или фильмов в 1080p). Устраняет шум и обеспечивает наивысший PSNR."
    mode_a_a_hq: "Улучшенная версия режима A: максимальное воспринимаемое качество, позволяет восстановить почти все повреждённые линии. Возможно появление избыточной резкости или звона."
    mode_b_b_hq: "Улучшенная версия режима B: более высокое воспринимаемое качество, дополнительная оптимизация линий и снижение артефактов."
    mode_c_a_hq: "Версия режима C с повышенным воспринимаемым качеством: сохраняет высокий PSNR и пытается восстановить часть деталей линий."
    mode_a_fast: "Быстрая версия режима A: баланс качества и производительности, подходит для большинства аниме в 1080p."
    mode_b_fast: "Быстрая версия режима B: обработка лёгких артефактов и звона с меньшими затратами ресурсов."
    mode_c_fast: "Быстрая версия режима C: быстрое шумоподавление и масштабирование качественных источников."
    mode_a_a_fast: "Быстрая версия режима A+A: обеспечивает более высокое воспринимаемое качество на устройствах с ограниченной производительностью."
    mode_b_b_fast: "Быстрая версия режима B+B: улучшенное восстановление линий и обработка артефактов для устройств с ограниченной производительностью."
    mode_c_a_fast: "Быстрая версия режима C+A: быстро обрабатывает качественные источники и обеспечивает лёгкое восстановление линий."
    upscale_only_s: "Сверхбыстрое масштабирование x2 только с помощью самой быстрой CNN-модели: без восстановления и шумоподавления, минимальные затраты ресурсов."
    upscale_deblur_fast: "Быстрое масштабирование и устранение размытия с помощью традиционных алгоритмов без CNN: лучше стандартных алгоритмов плеера при очень низких затратах ресурсов."
    restore_s_only: "Только восстановление с помощью самой быстрой CNN-модели, без масштабирования. Подходит для воспроизведения в нативном разрешении, когда нужно улучшить качество."
    denoise_bilateral_fast: "Быстрое шумоподавление с помощью традиционной двусторонней фильтрации: очень быстро, подходит для обработки слабого шума."
    upscale_non_cnn: "Быстрое масштабирование традиционными алгоритмами: очень низкие затраты ресурсов, лучше стандартных настроек плеера."
    mode_a_fast_darken: "Режим A (быстрый) + затемнение линий: добавляет эффект затемнения линий к быстрому режиму A для более выразительных, стилизованных линий."
    mode_a_hq_thin: "Режим A (HQ) + утончение линий: добавляет эффект утончения линий к высококачественному режиму A для более изящного вида."
  presetNames:
    mode_a_hq: "Mode A (HQ)"
    mode_b_hq: "Mode B (HQ)"
    mode_c_hq: "Mode C (HQ)"
    mode_a_a_hq: "Mode A+A (HQ)"
    mode_b_b_hq: "Mode B+B (HQ)"
    mode_c_a_hq: "Mode C+A (HQ)"
    mode_a_fast: "Mode A (Fast)"
    mode_b_fast: "Mode B (Fast)"
    mode_c_fast: "Mode C (Fast)"
    mode_a_a_fast: "Mode A+A (Fast)"
    mode_b_b_fast: "Mode B+B (Fast)"
    mode_c_a_fast: "Mode C+A (Fast)"
    upscale_only_s: "Масштабирование CNN (сверхбыстро)"
    upscale_deblur_fast: "Масштабирование и устранение размытия (быстро)"
    restore_s_only: "Восстановление (сверхбыстро)"
    denoise_bilateral_fast: "Двустороннее шумоподавление (сверхбыстро)"
    upscale_non_cnn: "Масштабирование без CNN (сверхбыстро)"
    mode_a_fast_darken: "Режим A (быстрый) + затемнение линий"
    mode_a_hq_thin: "Режим A (HQ) + утончение линий"
  performanceTip: "💡 Совет: выбирайте пресеты с учётом производительности устройства. На слабых устройствах рекомендуются облегчённые пресеты."
  compatibilityTip: "⚠️ Некоторые мобильные GPU (например, Kirin 980 / Mali-G76) не могут отрисовывать пользовательские шейдеры. Если изображение становится чёрным, а звук продолжает воспроизводиться, отключите Anime4K здесь."
  autoDisabledOnRenderFailure: "GPU вашего устройства не смог отрисовать шейдер Anime4K, поэтому он был отключён автоматически."

