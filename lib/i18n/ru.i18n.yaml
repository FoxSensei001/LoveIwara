      selectTitle: "Наведение и выбор"
      selectBody: "Наведите луч на кнопку, затем нажмите и отпустите триггер. Используется для воспроизведения, настроек и ползунков."
      selectHint: "Триггер находится под указательным пальцем. Кнопка хвата на рукоятке перемещает окна."
      panelTitle: "Показать или скрыть панель"
      panelBody: "Направьте луч мимо панели и нажмите триггер, чтобы скрыть или показать ее. При отслеживании рук выполните быстрый щипок в пустоте."
      panelHint: "Используйте короткое нажатие без перемещения. Удержание с движением перемещает экран."
      playTitle: "Воспроизведение и пауза"
      playBody: "Направьте луч в сторону от панели и нажмите кнопку A (справа) или X (слева). Также можно нажать кнопку воспроизведения на панели."
      playHint: "Это сочетание можно отключить в настройках пространственного плеера. При наведении на панель нажатие управляет панелью."
      seekTitle: "Перемотка стиком"
      seekBody: "Отклоните любой стик влево или вправо на 5 секунд. Удерживайте для быстрой перемотки с предпросмотром. Отпустите для применения."
      seekHint: "Удерживайте луч в стороне от панели управления, иначе стик будет прокручивать панель."
      browseTitle: "Просмотр стиком"
      browseBody: "Отклоните стик влево/вправо для перехода к предыдущему или следующему элементу; удерживайте для непрерывного листания. Можно также выбрать миниатюру."
      browseHint: "Видео в галерее также считаются элементами. Наведение на панель переключает стик на ее прокрутку."
      swipeTitle: "Перелистывание перетаскиванием"
      swipeBody: "Наведите на изображение, зажмите триггер и потяните влево. Отпустите после подсказки о смене страницы; потяните вправо для возврата. Щипок с перетаскиванием тоже работает."
      swipeHint: "Для перелистывания изображение должно быть в масштабе 1×. Поддерживаются и видео в галерее. Сцена остается на месте до отпускания."
      zoomTitle: "Масштабирование изображения"
      zoomBody: "Наведите на деталь, зажмите триггер и отклоните стик вверх для приближения или вниз для отдаления. Центр зума фиксируется в точке нажатия."
      zoomHint: "Масштабирует изображение внутри его окна. Без зажатия изображения стик вверх/вниз меняет расстояние до экрана."
      panTitle: "Панорамирование и сброс"
      panBody: "При приближении удерживайте триггер и двигайте руку для осмотра. Двойное нажатие по изображению увеличивает до 2.5× или сбрасывает масштаб. Руками: быстрый двойной щипок."
      panHint: "Перетаскивание перемещает увеличенное изображение. Сбросьте до 1× перед перелистыванием страниц."
      slideshowTitle: "Запуск слайд-шоу"
      slideshowBody: "Кнопки A / X на изображении запускают слайд-шоу. На панели можно выбрать интервал (3, 5, 10 или 20 с) и качество."
      slideshowHint: "Для видео в галерее A / X управляют воспроизведением. Горячие клавиши контроллера должны быть включены в настройках."
      moveTitle: "Захват и перемещение экрана"
      moveBody: "Зажмите кнопку хвата на внутренней стороне рукоятки, переместите экран контроллером и отпустите. При просмотре можно хватать экран, не целясь в него."
      moveHint: "Наведение на окно приложения или панель захватывает их в первую очередь. В панорамном видео хват вращает ракурс."
      scaleTitle: "Изменение размера двумя руками"
      scaleBody: "Зажмите обе кнопки хвата. Разведите руки в стороны для увеличения или сведите для уменьшения. Руками: удерживайте щипок обеими руками."
      scaleHint: "Для плоских и изогнутых экранов, включая сцену галереи. Не наводите на панель. Изменяет размер экрана целиком."
      distanceTitle: "Расстояние просмотра"
      distanceBody: "Отклоните стик вверх, чтобы отдалить экран, или вниз, чтобы приблизить. При захвате окна стик двигает это окно. Громкость настраивается на панели."
      distanceHint: "Направьте луч мимо панели управления. Удержание изображения переключает стик на зум; в панорамном видео настраивается угол обзора."
      resizeTitle: "Края и углы"
      resizeBody: "Рамка подсвечивается при приближении луча к краю. Зажмите триггер или щипок на краю для перемещения; потяните за угол для масштабирования."
      resizeHint: "Работает для окна приложения, панели управления и экрана. Окно меняет ширину и высоту; экран сохраняет пропорции."
      navigationTitle: "Назад и открытие настроек"
      navigationBody: "B / Y возвращает на шаг назад: закрывает всплывающее окно, скрывает панель и возвращает в приложение. Левая кнопка меню открывает настройки пространства."
      navigationHint: "Правая кнопка Meta зарезервирована системой. Системное центрирование возвращает экран перед вами с сохранением размера и расстояния."
      handsTitle: "Управление руками"
      handsBody: "При включенном отслеживании рук наведите системный луч на кнопку, сомкните большой и указательный пальцы (щипок) и разомкните. Панель служит для воспроизведения, перемотки и галереи."
      handsHint: "Щипок в пустоте скрывает/показывает панель. Щипок за край перемещает, за угол меняет размер, щипок двумя руками масштабирует экран."
