      bothGrips: "Les deux boutons de préhension"
      stick: "Stick"
      handTracking: "Suivi des mains"
      ready: "Prêt"
      press: "Appuyer"
      hold: "Maintenir"
      release: "Relâcher"
      result: "Voir le résultat"
      pinch: "Pincer"
      selectTitle: "Pointer et sélectionner"
      selectBody: "Visez un bouton avec le rayon, puis appuyez et relâchez la gâchette d'index. Utilisez-la pour la lecture, les réglages et les curseurs du panneau de contrôle."
      selectHint: "La gâchette d'index se trouve derrière la face du bouton. Le bouton de préhension sur la poignée intérieure saisit les fenêtres."
      panelTitle: "Afficher ou masquer le panneau"
      panelBody: "Pointez à l'extérieur du panneau de contrôle, puis appuyez sur la gâchette d'index pour l'afficher ou le masquer. Avec le suivi des mains, un pincement rapide hors du panneau fait la même chose."
      panelHint: "Faites une pression brève sans glisser. Maintenir et déplacer est un glissement, pas un basculement du panneau."
      playTitle: "Lire et mettre en pause"
      playBody: "Pointez ailleurs que vers le panneau de contrôle et appuyez sur A à droite ou X à gauche pour lire ou mettre en pause. Vous pouvez aussi sélectionner le bouton de lecture du panneau."
      playHint: "Ce raccourci par défaut peut être désactivé dans les paramètres du lecteur spatial. En pointant vers le panneau, la saisie va au panneau."
      seekTitle: "Se déplacer avec le stick"
      seekBody: "Poussez légèrement l'un ou l'autre stick vers la gauche ou la droite pour avancer de 5 secondes. Maintenez-le pour défiler plus vite tout en prévisualisant le temps cible. Relâchez pour valider la position."
      seekHint: "Gardez le rayon de cette manette hors du panneau de contrôle. Un stick pointé vers le panneau le fait défiler à la place."
      browseTitle: "Parcourir avec le stick"
      browseBody: "Déplacez l'un ou l'autre stick vers la gauche ou la droite pour passer à l'élément précédent ou suivant ; maintenez pour continuer à parcourir. Vous pouvez aussi sélectionner une vignette dans la bande d'images."
      browseHint: "Les vidéos d'une galerie sont aussi des éléments. En pointant vers le panneau de contrôle, le stick fait défiler le panneau."
      swipeTitle: "Glisser pour tourner une page"
      swipeBody: "Visez l'image, maintenez la gâchette d'index et faites glisser vers la gauche. Relâchez après l'indice de changement de page pour avancer ; faites glisser vers la droite pour revenir. Un pincement-glissement fonctionne aussi."
      swipeHint: "Les images doivent être à 1× pour changer de page en glissant. Les vidéos de galerie le permettent aussi. La scène reste immobile jusqu'au relâchement."
      zoomTitle: "Zoomer sur l'image"
      zoomBody: "Visez un détail de l'image, maintenez la gâchette d'index, puis poussez le stick vers le haut pour zoomer ou vers le bas pour dézoomer. Le zoom est ancré là où vous avez appuyé."
      zoomHint: "Cela agrandit l'image dans sa fenêtre. Sans maintenir l'image, le haut/bas ajuste la distance de visionnage."
      panTitle: "Déplacer et restaurer l'image"
      panBody: "Une fois zoomé, maintenez la gâchette d'index et faites glisser pour regarder autour. Double-touchez l'image pour zoomer à 2,5× ou la restaurer. Avec les mains, pincez deux fois rapidement."
      panHint: "Faire glisser déplace une image zoomée. Revenez à 1× avant de faire glisser pour tourner les pages."
      slideshowTitle: "Lancer un diaporama"
      slideshowBody: "Sur une image, A / X démarre ou met en pause le diaporama. Le panneau propose des intervalles de 3, 5, 10 ou 20 secondes et une qualité d'image standard ou d'origine."
      slideshowHint: "Sur une vidéo de galerie, A / X contrôle la lecture de cette vidéo. Le raccourci de la manette doit être activé dans les paramètres."
      moveTitle: "Saisir et déplacer l'écran"
      moveBody: "Maintenez le bouton de préhension sur la poignée intérieure, déplacez le contrôleur pour positionner l'écran, puis relâchez. Pendant le visionnage, vous pouvez saisir l'écran sans le viser."
      moveHint: "Viser la fenêtre de l'app ou le panneau de contrôle saisit d'abord cette fenêtre. Dans une vidéo panoramique, la préhension ajuste l'orientation."
      scaleTitle: "Redimensionner avec les deux mains"
      scaleBody: "Maintenez les deux boutons de préhension. Écartez les mains pour agrandir l'écran, ou rapprochez-les pour le réduire. Avec le suivi des mains, maintenez un pincement dans les deux mains."
      scaleHint: "Pour les écrans plats ou courbes, y compris la scène de galerie. Gardez les rayons hors du panneau de contrôle. Cela redimensionne tout l'écran."
      distanceTitle: "Ajuster la distance de visionnage"
      distanceBody: "Poussez le stick vers le haut pour éloigner l'écran, ou vers le bas pour le rapprocher. Lorsque vous saisissez une fenêtre, le haut/bas déplace cette fenêtre. Réglez le volume sur le panneau."
      distanceHint: "Pointez ailleurs que vers le panneau de contrôle. En maintenant une image, le haut/bas devient un zoom d'image ; pour les vidéos panoramiques, cela ajuste la vue."
      resizeTitle: "Utiliser les bords et les coins"
      resizeBody: "Le cadre s'illumine lorsque le rayon approche d'un bord. Maintenez la gâchette ou pincez sur un bord pour déplacer la fenêtre ; faites glisser un coin pour la redimensionner."
      resizeHint: "Fonctionne sur la fenêtre de l'app, le panneau de contrôle et l'écran. La fenêtre de l'app change de largeur et de hauteur ; les écrans conservent leurs proportions."
      navigationTitle: "Revenir en arrière et ouvrir les paramètres"
      navigationBody: "B / Y revient d'un niveau : ferme une fenêtre contextuelle ou revient à l'accueil du panneau, masque le panneau, puis revient à l'app. Le bouton Menu gauche ouvre les paramètres spatiaux."
      navigationHint: "Le bouton Meta droit appartient au système. Le recentrage système ramène la vue devant en conservant la taille et la distance de l'écran."
      handsTitle: "Utiliser vos mains"
      handsBody: "Lorsque le suivi des mains est activé, visez un bouton avec le rayon du système, pincez le pouce et l'index, puis relâchez. Utilisez le panneau pour la lecture, la navigation et les galeries."
      handsHint: "Pincez à l'extérieur pour afficher ou masquer le panneau. Pincez un bord pour déplacer, un coin pour redimensionner, ou pincez avec les deux mains et écartez pour agrandir l'écran."
