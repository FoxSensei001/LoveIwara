# Anime4K Settings
anime4k:
  realTimeVideoUpscalingAndDenoising: "Mise à l'échelle et débruitage vidéo en temps réel, améliorant la qualité des vidéos d'animation"
  settings: "Réglages Anime4K"
  preset: "Préréglage Anime4K"
  disable: "Désactiver Anime4K"
  disableDescription: "Désactiver les effets d'amélioration vidéo"
  highQualityPresets: "Préréglages haute qualité"
  fastPresets: "Préréglages rapides"
  litePresets: "Préréglages légers"
  moreLitePresets: "Préréglages très légers"
  customPresets: "Préréglages personnalisés"
  presetGroups:
    highQuality: "Haute qualité"
    fast: "Rapide"
    lite: "Léger"
    moreLite: "Très léger"
    custom: "Personnalisé"
  presetDescriptions:
    mode_a_hq: "Adapté à la plupart des animations 1080p, en particulier celles présentant du flou, du rééchantillonnage et des artefacts de compression. Offre la meilleure qualité perçue."
    mode_b_hq: "Adapté aux animations présentant un léger flou ou des halos dus à la mise à l'échelle. Réduit efficacement les halos et l'aliasing."
    mode_c_hq: "Adapté aux sources de haute qualité (animations ou films 1080p natifs, par exemple). Débruite et offre le meilleur PSNR."
    mode_a_a_hq: "Version améliorée du mode A, offrant une qualité perçue optimale et reconstruisant presque toutes les lignes dégradées. Peut produire un excès de netteté ou des halos."
    mode_b_b_hq: "Version améliorée du mode B, offrant une meilleure qualité perçue, optimisant davantage les lignes et réduisant les artefacts."
    mode_c_a_hq: "Version du mode C à qualité perçue améliorée, conservant un PSNR élevé tout en tentant de reconstruire certains détails de lignes."
    mode_a_fast: "Version rapide du mode A, équilibrant qualité et performances, adaptée à la plupart des animations 1080p."
    mode_b_fast: "Version rapide du mode B, pour traiter les légers artefacts et halos avec un coût réduit."
    mode_c_fast: "Version rapide du mode C, pour un débruitage et une mise à l'échelle rapides des sources de haute qualité."
    mode_a_a_fast: "Version rapide du mode A+A, visant une meilleure qualité perçue sur les appareils peu puissants."
    mode_b_b_fast: "Version rapide du mode B+B, offrant une meilleure réparation des lignes et un traitement des artefacts sur les appareils peu puissants."
    mode_c_a_fast: "Version rapide du mode C+A, traitant rapidement les sources de haute qualité tout en offrant une légère réparation des lignes."
    upscale_only_s: "Mise à l'échelle x2 ultra-rapide via le modèle CNN le plus rapide uniquement, sans réparation ni débruitage, coût minimal."
    upscale_deblur_fast: "Mise à l'échelle et défloutage rapides via des algorithmes classiques non CNN, meilleurs que ceux du lecteur par défaut avec un coût très faible."
    restore_s_only: "Réparation uniquement via le modèle CNN le plus rapide, sans mise à l'échelle. Adapté à la lecture en résolution native lorsque vous voulez améliorer la qualité."
    denoise_bilateral_fast: "Débruitage rapide par filtrage bilatéral classique, très rapide, adapté au bruit léger."
    upscale_non_cnn: "Mise à l'échelle rapide via des algorithmes classiques, coût très faible, meilleure que les réglages par défaut du lecteur."
    mode_a_fast_darken: "Mode A (rapide) + assombrissement des lignes, ajoutant un effet d'assombrissement au mode A rapide pour des lignes plus marquées et stylisées."
    mode_a_hq_thin: "Mode A (HQ) + affinage des lignes, ajoutant un effet d'affinage au mode A haute qualité pour un rendu plus fin."
  presetNames:
    mode_a_hq: "Mode A (HQ)"
    mode_b_hq: "Mode B (HQ)"
    mode_c_hq: "Mode C (HQ)"
    mode_a_a_hq: "Mode A+A (HQ)"
    mode_b_b_hq: "Mode B+B (HQ)"
    mode_c_a_hq: "Mode C+A (HQ)"
    mode_a_fast: "Mode A (Fast)"
    mode_b_fast: "Mode B (Fast)"
    mode_c_fast: "Mode C (Fast)"
    mode_a_a_fast: "Mode A+A (Fast)"
    mode_b_b_fast: "Mode B+B (Fast)"
    mode_c_a_fast: "Mode C+A (Fast)"
    upscale_only_s: "Mise à l'échelle CNN (ultra rapide)"
    upscale_deblur_fast: "Mise à l'échelle et défloutage (rapide)"
    restore_s_only: "Restauration (ultra rapide)"
    denoise_bilateral_fast: "Débruitage bilatéral (ultra rapide)"
    upscale_non_cnn: "Mise à l'échelle non CNN (ultra rapide)"
    mode_a_fast_darken: "Mode A (rapide) + assombrissement des lignes"
    mode_a_hq_thin: "Mode A (HQ) + affinage des lignes"
  performanceTip: "💡 Astuce : choisissez des préréglages adaptés aux performances de l'appareil. Les appareils d'entrée de gamme devraient utiliser des préréglages légers."
  compatibilityTip: "⚠️ Certains GPU mobiles (ex. Kirin 980 / Mali-G76) ne peuvent afficher aucun shader personnalisé. Si l'image devient noire alors que le son continue, désactivez Anime4K ici."
