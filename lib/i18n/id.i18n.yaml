      hold: "Tahan"
      release: "Lepaskan"
      result: "Lihat hasilnya"
      pinch: "Cubit"
      selectTitle: "Arahkan dan pilih"
      selectBody: "Arahkan sinar ke tombol, lalu tekan dan lepaskan pemicu telunjuk. Gunakan untuk memutar, pengaturan, dan penggeser di panel kontrol."
      selectHint: "Pemicu telunjuk berada di belakang permukaan tombol. Tombol pegangan pada gagang dalam berfungsi memegang jendela."
      panelTitle: "Tampilkan atau sembunyikan panel"
      panelBody: "Arahkan ke luar panel kontrol, lalu ketuk pemicu telunjuk untuk menampilkan atau menyembunyikannya. Dengan pelacakan tangan, cubitan cepat di luar panel melakukan hal yang sama."
      panelHint: "Gunakan ketukan singkat tanpa menyeret. Menahan dan menggerakkan adalah seret, bukan mengalihkan panel."
      playTitle: "Putar dan jeda"
      playBody: "Arahkan menjauh dari panel kontrol lalu tekan A di kanan atau X di kiri untuk memutar atau menjeda. Anda juga dapat memilih tombol putar di panel."
      playHint: "Pintasan bawaan ini dapat dinonaktifkan di pengaturan pemutar spasial. Saat mengarahkan ke panel, masukan akan masuk ke panel."
      seekTitle: "Geser dengan stik"
      seekBody: "Geser salah satu stik ke kiri atau kanan untuk langkah 5 detik. Tahan untuk menggeser lebih cepat sambil mempratinjau waktu target. Lepaskan untuk menerapkan pencarian."
      seekHint: "Jauhkan sinar pengontrol itu dari panel kontrol. Stik yang mengarah ke panel akan menggulir panel sebagai gantinya."
      browseTitle: "Jelajahi dengan stik"
      browseBody: "Gerakkan salah satu stik ke kiri atau kanan untuk item sebelumnya atau berikutnya; tahan untuk terus menjelajah. Anda juga dapat memilih gambar mini di strip film."
      browseHint: "Video dalam galeri juga merupakan item. Mengarahkan ke panel kontrol membuat stik menggulir panel."
      swipeTitle: "Seret melintasi untuk membalik halaman"
      swipeBody: "Arahkan ke gambar, tahan pemicu telunjuk dan seret ke kiri. Lepaskan setelah isyarat balik halaman untuk maju; seret ke kanan untuk kembali. Cubit-lalu-seret juga berfungsi."
      swipeHint: "Gambar harus pada 1× untuk membalik halaman dengan menyeret. Video galeri juga mendukungnya. Panggung tetap diam hingga Anda melepaskan."
      zoomTitle: "Perbesar ke dalam gambar"
      zoomBody: "Arahkan ke detail pada gambar, tahan pemicu telunjuk, lalu dorong stik ke atas untuk memperbesar atau ke bawah untuk memperkecil. Zoom berjangkar di tempat Anda menekan."
      zoomHint: "Ini memperbesar gambar di dalam jendelanya. Tanpa menahan gambar, atas/bawah menyesuaikan jarak pandang."
      panTitle: "Geser dan pulihkan gambar"
      panBody: "Setelah diperbesar, tahan pemicu telunjuk dan seret untuk melihat sekeliling. Ketuk dua kali gambar untuk memperbesar ke 2,5× atau memulihkannya. Dengan tangan, cubit dua kali dengan cepat."
      panHint: "Menyeret akan menggeser gambar yang diperbesar. Pulihkan ke 1× sebelum menyeret untuk membalik halaman."
      slideshowTitle: "Mulai tayangan slide"
      slideshowBody: "Pada gambar, A / X memulai atau menjeda tayangan slide. Panel menawarkan interval 3, 5, 10, atau 20 detik serta kualitas gambar standar atau asli."
      slideshowHint: "Pada video galeri, A / X mengontrol pemutaran video tersebut. Pintasan pengontrol harus diaktifkan di pengaturan."
      moveTitle: "Pegang dan pindahkan layar"
      moveBody: "Tahan tombol pegangan pada gagang dalam, gerakkan pengontrol untuk memposisikan layar, lalu lepaskan. Saat menonton, Anda dapat memegang layar tanpa mengarahkannya."
      moveHint: "Mengarahkan ke jendela aplikasi atau panel kontrol akan memegang jendela itu terlebih dahulu. Pada video panoramik, memegang menyesuaikan orientasi."
      scaleTitle: "Ubah ukuran dengan kedua tangan"
      scaleBody: "Tahan kedua tombol pegangan. Rentangkan tangan Anda untuk memperbesar layar, atau dekatkan untuk memperkecilnya. Dengan pelacakan tangan, tahan cubitan di kedua tangan."
      scaleHint: "Untuk layar datar atau melengkung, termasuk panggung galeri. Jauhkan sinar dari panel kontrol. Ini mengubah ukuran seluruh layar."
      distanceTitle: "Sesuaikan jarak pandang"
      distanceBody: "Dorong stik ke atas untuk menjauhkan layar, atau ke bawah untuk mendekatkannya. Saat memegang jendela, atas/bawah memindahkan jendela itu. Sesuaikan volume di panel."
      distanceHint: "Arahkan menjauh dari panel kontrol. Menahan gambar mengubah atas/bawah menjadi zoom gambar; video panoramik menyesuaikan tampilan sebagai gantinya."
      resizeTitle: "Gunakan tepi dan sudut"
      resizeBody: "Bingkai akan menyala saat sinar Anda mendekati tepi. Tahan pemicu atau cubit pada tepi untuk memindahkan jendela; seret sudut untuk mengubah ukurannya."
      resizeHint: "Berfungsi pada jendela aplikasi, panel kontrol, dan layar. Jendela aplikasi mengubah lebar dan tinggi; layar mempertahankan rasio aspeknya."
      navigationTitle: "Kembali dan buka pengaturan"
      navigationBody: "B / Y kembali satu tingkat: menutup popup atau kembali ke beranda panel, menyembunyikan panel, lalu kembali ke aplikasi. Tombol Menu kiri membuka pengaturan spasial."
      navigationHint: "Tombol Meta kanan milik sistem. Pemusatan ulang sistem membawa tampilan kembali ke depan sambil mempertahankan ukuran dan jarak layar."
      handsTitle: "Gunakan tangan Anda"
      handsBody: "Dengan pelacakan tangan aktif, arahkan sinar sistem ke tombol, cubit ibu jari dan telunjuk Anda, lalu lepaskan. Gunakan panel untuk pemutaran, pencarian, dan navigasi galeri."
      handsHint: "Cubit di luar untuk mengalihkan panel. Cubit tepi untuk memindahkan, sudut untuk mengubah ukuran, atau cubit dengan kedua tangan dan rentangkan untuk memperbesar layar."
