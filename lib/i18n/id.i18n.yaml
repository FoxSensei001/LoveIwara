# Anime4K Settings
anime4k:
  realTimeVideoUpscalingAndDenoising: "Peningkatan resolusi dan penghilangan noise video secara real-time, meningkatkan kualitas video animasi"
  settings: "Pengaturan Anime4K"
  preset: "Preset Anime4K"
  disable: "Nonaktifkan Anime4K"
  disableDescription: "Nonaktifkan efek peningkatan video"
  highQualityPresets: "Preset Kualitas Tinggi"
  fastPresets: "Preset Cepat"
  litePresets: "Preset Ringan"
  moreLitePresets: "Preset Lebih Ringan"
  customPresets: "Preset Kustom"
  presetGroups:
    highQuality: "Kualitas Tinggi"
    fast: "Cepat"
    lite: "Ringan"
    moreLite: "Lebih Ringan"
    custom: "Kustom"
  presetDescriptions:
    mode_a_hq: "Cocok untuk sebagian besar animasi 1080p, terutama yang menghadapi blur, resampling, dan artefak kompresi. Memberikan kualitas persepsi tertinggi."
    mode_b_hq: "Cocok untuk animasi dengan blur ringan atau efek ringing akibat penskalaan. Dapat mengurangi ringing dan aliasing secara efektif."
    mode_c_hq: "Cocok untuk sumber berkualitas tinggi (seperti animasi 1080p asli atau film). Menghilangkan noise dan memberikan PSNR tertinggi."
    mode_a_a_hq: "Versi lanjutan Mode A, memberikan kualitas persepsi maksimal dan dapat merekonstruksi hampir semua garis yang rusak. Dapat menimbulkan penajaman berlebihan atau ringing."
    mode_b_b_hq: "Versi lanjutan Mode B, memberikan kualitas persepsi lebih tinggi, lebih mengoptimalkan garis dan mengurangi artefak."
    mode_c_a_hq: "Versi Mode C dengan kualitas persepsi yang ditingkatkan, mempertahankan PSNR tinggi sekaligus mencoba merekonstruksi sebagian detail garis."
    mode_a_fast: "Versi cepat Mode A, menyeimbangkan kualitas dan performa, cocok untuk sebagian besar animasi 1080p."
    mode_b_fast: "Versi cepat Mode B, untuk menangani artefak dan ringing ringan dengan beban lebih rendah."
    mode_c_fast: "Versi cepat Mode C, untuk penghilangan noise dan peningkatan resolusi sumber berkualitas tinggi secara cepat."
    mode_a_a_fast: "Versi cepat Mode A+A, mengejar kualitas persepsi lebih tinggi pada perangkat dengan performa terbatas."
    mode_b_b_fast: "Versi cepat Mode B+B, menyediakan perbaikan garis dan pemrosesan artefak yang ditingkatkan untuk perangkat dengan performa terbatas."
    mode_c_a_fast: "Versi cepat Mode C+A, memproses sumber berkualitas tinggi dengan cepat sekaligus memberikan perbaikan garis ringan."
    upscale_only_s: "Peningkatan resolusi x2 ultra cepat hanya dengan model CNN tercepat, tanpa perbaikan dan penghilangan noise, beban performa minimal."
    upscale_deblur_fast: "Peningkatan resolusi dan penghilangan blur secara cepat menggunakan algoritma tradisional non-CNN, lebih baik daripada algoritma pemutar bawaan dengan beban performa sangat rendah."
    restore_s_only: "Hanya perbaikan menggunakan model CNN tercepat, tanpa peningkatan resolusi. Cocok untuk pemutaran resolusi asli yang ingin ditingkatkan kualitasnya."
    denoise_bilateral_fast: "Penghilangan noise cepat menggunakan filter bilateral tradisional, sangat cepat, cocok untuk menangani noise ringan."
    upscale_non_cnn: "Peningkatan resolusi cepat menggunakan algoritma tradisional, beban performa sangat rendah, lebih baik daripada bawaan pemutar."
    mode_a_fast_darken: "Mode A (Cepat) + Penggelapan garis, menambahkan efek penggelapan garis pada mode A cepat untuk garis yang lebih menonjol dan bergaya."
    mode_a_hq_thin: "Mode A (HQ) + Penipisan garis, menambahkan efek penipisan garis pada mode A kualitas tinggi untuk tampilan yang lebih halus."
  presetNames:
    mode_a_hq: "Mode A (HQ)"
    mode_b_hq: "Mode B (HQ)"
    mode_c_hq: "Mode C (HQ)"
    mode_a_a_hq: "Mode A+A (HQ)"
    mode_b_b_hq: "Mode B+B (HQ)"
    mode_c_a_hq: "Mode C+A (HQ)"
    mode_a_fast: "Mode A (Fast)"
    mode_b_fast: "Mode B (Fast)"
    mode_c_fast: "Mode C (Fast)"
    mode_a_a_fast: "Mode A+A (Fast)"
    mode_b_b_fast: "Mode B+B (Fast)"
    mode_c_a_fast: "Mode C+A (Fast)"
    upscale_only_s: "Peningkatan Resolusi CNN (Ultra Cepat)"
    upscale_deblur_fast: "Peningkatan Resolusi & Penghilangan Blur (Cepat)"
    restore_s_only: "Restorasi (Ultra Cepat)"
    denoise_bilateral_fast: "Penghilangan Noise Bilateral (Ultra Cepat)"
    upscale_non_cnn: "Peningkatan Resolusi Non-CNN (Ultra Cepat)"
    mode_a_fast_darken: "Mode A (Cepat) + Penggelapan Garis"
    mode_a_hq_thin: "Mode A (HQ) + Penipisan Garis"
  performanceTip: "💡 Tips: Pilih preset yang sesuai dengan performa perangkat. Perangkat kelas bawah disarankan menggunakan preset ringan."
  compatibilityTip: "⚠️ Sebagian GPU seluler (mis. Kirin 980 / Mali-G76) tidak dapat merender shader kustom apa pun. Jika gambar menjadi hitam sementara audio tetap berjalan, nonaktifkan Anime4K di sini."
