      slideshowTitle: "Bắt đầu trình chiếu"
      slideshowBody: "Trên một hình ảnh, A / X bắt đầu hoặc tạm dừng trình chiếu. Bảng cung cấp khoảng thời gian 3, 5, 10 hoặc 20 giây và chất lượng hình ảnh tiêu chuẩn hoặc gốc."
      slideshowHint: "Trên video trong thư viện, A / X điều khiển việc phát video đó. Phím tắt bộ điều khiển phải được bật trong cài đặt."
      moveTitle: "Nắm và di chuyển màn hình"
      moveBody: "Giữ nút cầm ở tay cầm bên trong, di chuyển bộ điều khiển để đặt vị trí màn hình, rồi thả ra. Khi đang xem, bạn có thể nắm màn hình mà không cần chỉ vào nó."
      moveHint: "Chỉ vào cửa sổ ứng dụng hoặc bảng điều khiển sẽ nắm cửa sổ đó trước. Trong video toàn cảnh, việc cầm nắm sẽ điều chỉnh hướng."
      scaleTitle: "Đổi kích thước bằng cả hai tay"
      scaleBody: "Giữ cả hai nút cầm. Dang hai tay ra để phóng to màn hình, hoặc chụm lại để thu nhỏ. Với theo dõi bàn tay, giữ thao tác chụm ở cả hai tay."
      scaleHint: "Cho màn hình phẳng hoặc cong, kể cả sân khấu thư viện. Giữ tia ngoài bảng điều khiển. Thao tác này đổi kích thước toàn bộ màn hình."
      distanceTitle: "Điều chỉnh khoảng cách xem"
      distanceBody: "Đẩy cần gạt lên để đưa màn hình ra xa, hoặc xuống để kéo lại gần. Khi đang nắm một cửa sổ, lên/xuống sẽ di chuyển cửa sổ đó. Điều chỉnh âm lượng trên bảng."
      distanceHint: "Chỉ ra xa bảng điều khiển. Giữ một hình ảnh sẽ đổi lên/xuống thành thu phóng hình ảnh; video toàn cảnh sẽ điều chỉnh tầm nhìn thay vào đó."
      resizeTitle: "Dùng các cạnh và góc"
      resizeBody: "Khung sẽ sáng lên khi tia của bạn tiến gần một cạnh. Giữ cò hoặc chụm vào một cạnh để di chuyển cửa sổ; kéo một góc để đổi kích thước."
      resizeHint: "Hoạt động trên cửa sổ ứng dụng, bảng điều khiển và màn hình. Cửa sổ ứng dụng thay đổi chiều rộng và chiều cao; màn hình giữ nguyên tỉ lệ khung hình."
      navigationTitle: "Quay lại và mở cài đặt"
      navigationBody: "B / Y lùi một cấp: đóng cửa sổ bật lên hoặc quay về trang chính của bảng, ẩn bảng, rồi quay về ứng dụng. Nút Menu bên trái mở cài đặt không gian."
      navigationHint: "Nút Meta bên phải thuộc về hệ thống. Chức năng định vị lại của hệ thống đưa tầm nhìn về phía trước trong khi giữ nguyên kích thước và khoảng cách màn hình."
      handsTitle: "Dùng bàn tay"
      handsBody: "Khi bật theo dõi bàn tay, hướng tia của hệ thống vào một nút, chụm ngón cái và ngón trỏ, rồi thả ra. Dùng bảng để phát, tua và điều hướng thư viện."
      handsHint: "Chụm bên ngoài để bật/tắt bảng. Chụm một cạnh để di chuyển, một góc để đổi kích thước, hoặc chụm bằng cả hai tay rồi dang ra để phóng to màn hình."
