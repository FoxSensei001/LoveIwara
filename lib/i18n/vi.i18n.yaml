# Anime4K Settings
anime4k:
  realTimeVideoUpscalingAndDenoising: "Nâng tỉ lệ và khử nhiễu video theo thời gian thực, nâng cao chất lượng video hoạt hình"
  settings: "Cài đặt Anime4K"
  preset: "Cấu hình Anime4K"
  disable: "Tắt Anime4K"
  disableDescription: "Tắt hiệu ứng nâng cao chất lượng video"
  highQualityPresets: "Cấu hình chất lượng cao"
  fastPresets: "Cấu hình nhanh"
  litePresets: "Cấu hình nhẹ"
  moreLitePresets: "Cấu hình nhẹ hơn"
  customPresets: "Cấu hình tùy chỉnh"
  presetGroups:
    highQuality: "Chất lượng cao"
    fast: "Nhanh"
    lite: "Nhẹ"
    moreLite: "Nhẹ hơn"
    custom: "Tùy chỉnh"
  presetDescriptions:
    mode_a_hq: "Phù hợp với hầu hết video hoạt hình 1080p, đặc biệt là các trường hợp bị mờ, lấy mẫu lại và nén. Mang lại chất lượng cảm nhận cao nhất."
    mode_b_hq: "Phù hợp với video hoạt hình bị mờ nhẹ hoặc có viền răng cưa do nâng tỉ lệ. Giảm hiệu quả viền răng cưa và hiện tượng răng cưa."
    mode_c_hq: "Phù hợp với nguồn chất lượng cao (như video hoạt hình hoặc phim 1080p gốc). Khử nhiễu và mang lại PSNR cao nhất."
    mode_a_a_hq: "Phiên bản nâng cao của Mode A, mang lại chất lượng cảm nhận tối đa và có thể tái tạo gần như toàn bộ đường nét bị suy giảm. Có thể gây quá sắc hoặc viền răng cưa."
    mode_b_b_hq: "Phiên bản nâng cao của Mode B, mang lại chất lượng cảm nhận cao hơn, tối ưu đường nét và giảm lỗi hình."
    mode_c_a_hq: "Phiên bản nâng cao chất lượng cảm nhận của Mode C, duy trì PSNR cao đồng thời cố tái tạo một số chi tiết đường nét."
    mode_a_fast: "Phiên bản nhanh của Mode A, cân bằng giữa chất lượng và hiệu năng, phù hợp với hầu hết video hoạt hình 1080p."
    mode_b_fast: "Phiên bản nhanh của Mode B, xử lý lỗi hình nhẹ và viền răng cưa với chi phí thấp hơn."
    mode_c_fast: "Phiên bản nhanh của Mode C, khử nhiễu và nâng tỉ lệ nhanh cho nguồn chất lượng cao."
    mode_a_a_fast: "Phiên bản nhanh của Mode A+A, hướng tới chất lượng cảm nhận cao hơn trên thiết bị hạn chế hiệu năng."
    mode_b_b_fast: "Phiên bản nhanh của Mode B+B, tăng cường sửa đường nét và xử lý lỗi hình cho thiết bị hạn chế hiệu năng."
    mode_c_a_fast: "Phiên bản nhanh của Mode C+A, xử lý nhanh nguồn chất lượng cao đồng thời sửa đường nét nhẹ."
    upscale_only_s: "Nâng tỉ lệ x2 cực nhanh chỉ bằng mô hình CNN nhanh nhất, không phục hồi hay khử nhiễu, chi phí hiệu năng tối thiểu."
    upscale_deblur_fast: "Nâng tỉ lệ và làm nét nhanh bằng thuật toán truyền thống không dùng CNN, tốt hơn thuật toán mặc định của trình phát với chi phí hiệu năng rất thấp."
    restore_s_only: "Chỉ phục hồi bằng mô hình CNN nhanh nhất, không nâng tỉ lệ. Phù hợp khi phát ở độ phân giải gốc mà muốn nâng cao chất lượng."
    denoise_bilateral_fast: "Khử nhiễu nhanh bằng lọc song phương truyền thống, cực nhanh, phù hợp xử lý nhiễu nhẹ."
    upscale_non_cnn: "Nâng tỉ lệ nhanh bằng thuật toán truyền thống, chi phí hiệu năng rất thấp, tốt hơn mặc định của trình phát."
    mode_a_fast_darken: "Mode A (Fast) + làm đậm đường nét, bổ sung hiệu ứng làm đậm đường nét cho Mode A nhanh, giúp đường nét nổi bật và cách điệu hơn."
    mode_a_hq_thin: "Mode A (HQ) + làm mảnh đường nét, bổ sung hiệu ứng làm mảnh đường nét cho Mode A chất lượng cao, giúp hình ảnh tinh tế hơn."
  presetNames:
    mode_a_hq: "Mode A (HQ)"
    mode_b_hq: "Mode B (HQ)"
    mode_c_hq: "Mode C (HQ)"
    mode_a_a_hq: "Mode A+A (HQ)"
    mode_b_b_hq: "Mode B+B (HQ)"
    mode_c_a_hq: "Mode C+A (HQ)"
    mode_a_fast: "Mode A (Fast)"
    mode_b_fast: "Mode B (Fast)"
    mode_c_fast: "Mode C (Fast)"
    mode_a_a_fast: "Mode A+A (Fast)"
    mode_b_b_fast: "Mode B+B (Fast)"
    mode_c_a_fast: "Mode C+A (Fast)"
    upscale_only_s: "Nâng tỉ lệ CNN (cực nhanh)"
    upscale_deblur_fast: "Nâng tỉ lệ & làm nét (nhanh)"
    restore_s_only: "Phục hồi (cực nhanh)"
    denoise_bilateral_fast: "Khử nhiễu song phương (cực nhanh)"
    upscale_non_cnn: "Nâng tỉ lệ không CNN (cực nhanh)"
    mode_a_fast_darken: "Mode A (Fast) + làm đậm đường nét"
    mode_a_hq_thin: "Mode A (HQ) + làm mảnh đường nét"
  performanceTip: "💡 Mẹo: chọn cấu hình phù hợp với hiệu năng thiết bị. Thiết bị cấu hình thấp nên dùng cấu hình nhẹ."
  compatibilityTip: "⚠️ Một số GPU di động (ví dụ Kirin 980 / Mali-G76) không kết xuất được shader tùy chỉnh. Nếu hình ảnh chuyển đen trong khi âm thanh vẫn phát, hãy tắt Anime4K tại đây."
  autoDisabledOnRenderFailure: "GPU của thiết bị không kết xuất được shader Anime4K nên tính năng đã tự động tắt."

