# Anime4K Settings
anime4k:
  realTimeVideoUpscalingAndDenoising: "Echtzeit-Video-Upscaling und Rauschunterdrückung zur Verbesserung der Qualität von Animationsvideos"
  settings: "Anime4K-Einstellungen"
  preset: "Anime4K-Preset"
  disable: "Anime4K deaktivieren"
  disableDescription: "Video-Verbesserungseffekte deaktivieren"
  highQualityPresets: "Presets hoher Qualität"
  fastPresets: "Schnelle Presets"
  litePresets: "Leichte Presets"
  moreLitePresets: "Noch leichtere Presets"
  customPresets: "Eigene Presets"
  presetGroups:
    highQuality: "Hohe Qualität"
    fast: "Schnell"
    lite: "Leicht"
    moreLite: "Leichter"
    custom: "Eigene"
  presetDescriptions:
    mode_a_hq: "Geeignet für die meisten 1080p-Animationen, insbesondere bei Unschärfe, Resampling- und Kompressionsartefakten. Bietet die höchste wahrgenommene Qualität."
    mode_b_hq: "Geeignet für Animationen mit leichter Unschärfe oder durch Skalierung verursachtem Ringing. Kann Ringing und Aliasing wirksam reduzieren."
    mode_c_hq: "Geeignet für hochwertige Quellen (z. B. native 1080p-Animationen oder Filme). Unterdrückt Rauschen und bietet den höchsten PSNR."
    mode_a_a_hq: "Erweiterte Version von Modus A, bietet höchste wahrgenommene Qualität und kann fast alle degradierten Linien rekonstruieren. Kann Überschärfung oder Ringing erzeugen."
    mode_b_b_hq: "Erweiterte Version von Modus B, bietet höhere wahrgenommene Qualität, optimiert Linien weiter und reduziert Artefakte."
    mode_c_a_hq: "Version von Modus C mit verbesserter wahrgenommener Qualität, hält hohen PSNR und versucht, einige Liniendetails zu rekonstruieren."
    mode_a_fast: "Schnelle Version von Modus A, gleicht Qualität und Leistung aus, geeignet für die meisten 1080p-Animationen."
    mode_b_fast: "Schnelle Version von Modus B, für geringe Artefakte und Ringing mit geringerem Aufwand."
    mode_c_fast: "Schnelle Version von Modus C, für schnelle Rauschunterdrückung und Skalierung hochwertiger Quellen."
    mode_a_a_fast: "Schnelle Version von Modus A+A, für höhere wahrgenommene Qualität auf leistungsbegrenzten Geräten."
    mode_b_b_fast: "Schnelle Version von Modus B+B, bietet verbesserte Linienreparatur und Artefaktverarbeitung für leistungsbegrenzte Geräte."
    mode_c_a_fast: "Schnelle Version von Modus C+A, verarbeitet hochwertige Quellen schnell und bietet leichte Linienreparatur."
    upscale_only_s: "Ultraschnelles x2-Upscaling nur mit dem schnellsten CNN-Modell, keine Reparatur und Rauschunterdrückung, minimaler Leistungsaufwand."
    upscale_deblur_fast: "Schnelles Upscaling und Deblurring mit herkömmlichen Nicht-CNN-Algorithmen, besser als Standard-Player-Algorithmen bei sehr geringem Leistungsaufwand."
    restore_s_only: "Nur Reparatur mit dem schnellsten CNN-Modell, kein Upscaling. Geeignet für Wiedergabe in nativer Auflösung, wenn Sie die Qualität verbessern möchten."
    denoise_bilateral_fast: "Schnelle Rauschunterdrückung mit herkömmlicher bilateraler Filterung, extrem schnell, geeignet für leichtes Rauschen."
    upscale_non_cnn: "Schnelles Upscaling mit herkömmlichen Algorithmen, sehr geringer Leistungsaufwand, besser als die Player-Standardeinstellungen."
    mode_a_fast_darken: "Modus A (Schnell) + Linienabdunklung, fügt zusätzlich zur schnellen Variante A eine Linienabdunklung für kräftigere, stilisierte Linien hinzu."
    mode_a_hq_thin: "Modus A (HQ) + Linienverdünnung, fügt zusätzlich zur hochwertigen Variante A eine Linienverdünnung für ein feineres Erscheinungsbild hinzu."
  presetNames:
    mode_a_hq: "Mode A (HQ)"
    mode_b_hq: "Mode B (HQ)"
    mode_c_hq: "Mode C (HQ)"
    mode_a_a_hq: "Mode A+A (HQ)"
    mode_b_b_hq: "Mode B+B (HQ)"
    mode_c_a_hq: "Mode C+A (HQ)"
    mode_a_fast: "Mode A (Fast)"
    mode_b_fast: "Mode B (Fast)"
    mode_c_fast: "Mode C (Fast)"
    mode_a_a_fast: "Mode A+A (Fast)"
    mode_b_b_fast: "Mode B+B (Fast)"
    mode_c_a_fast: "Mode C+A (Fast)"
    upscale_only_s: "CNN-Upscaling (Ultraschnell)"
    upscale_deblur_fast: "Upscaling & Deblurring (Schnell)"
    restore_s_only: "Restaurierung (Ultraschnell)"
    denoise_bilateral_fast: "Bilaterale Rauschunterdrückung (Ultraschnell)"
    upscale_non_cnn: "Nicht-CNN-Upscaling (Ultraschnell)"
    mode_a_fast_darken: "Modus A (Schnell) + Linienabdunklung"
    mode_a_hq_thin: "Modus A (HQ) + Linienverdünnung"
  performanceTip: "💡 Tipp: Wählen Sie passende Presets je nach Geräteleistung. Für leistungsschwache Geräte empfiehlt sich die Verwendung leichter Presets."
  compatibilityTip: "⚠️ Einige mobile GPUs (z. B. Kirin 980 / Mali-G76) können keine benutzerdefinierten Shader rendern. Wenn das Bild schwarz wird, der Ton aber weiterläuft, deaktivieren Sie Anime4K hier."
  autoDisabledOnRenderFailure: "Die GPU Ihres Geräts konnte den Anime4K-Shader nicht rendern, daher wurde er automatisch deaktiviert."

