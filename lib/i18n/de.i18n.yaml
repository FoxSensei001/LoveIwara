      panelBody: "Zeigen Sie außerhalb des Bedienfelds und tippen Sie dann auf den Zeigefinger-Auslöser, um es ein- oder auszublenden. Mit Handverfolgung bewirkt ein kurzes Kneifen außerhalb des Bedienfelds dasselbe."
      panelHint: "Verwenden Sie ein kurzes Tippen ohne Ziehen. Halten und Bewegen ist ein Ziehen, kein Umschalten des Bedienfelds."
      playTitle: "Abspielen und pausieren"
      playBody: "Zeigen Sie weg vom Bedienfeld und drücken Sie A rechts oder X links, um abzuspielen oder zu pausieren. Sie können auch die Wiedergabetaste im Bedienfeld auswählen."
      playHint: "Dieses Standard-Tastenkürzel kann in den Einstellungen des räumlichen Players deaktiviert werden. Wenn Sie auf das Bedienfeld zeigen, gehen Eingaben an das Bedienfeld."
      seekTitle: "Mit dem Stick spulen"
      seekBody: "Bewegen Sie einen der Sticks leicht nach links oder rechts für einen 5-Sekunden-Schritt. Halten Sie ihn, um schneller zu spulen, während die Zielzeit als Vorschau angezeigt wird. Lassen Sie los, um das Spulen zu übernehmen."
      seekHint: "Halten Sie den Strahl dieses Controllers vom Bedienfeld fern. Ein Stick, der auf das Bedienfeld zeigt, scrollt stattdessen das Bedienfeld."
      browseTitle: "Mit dem Stick blättern"
      browseBody: "Bewegen Sie einen der Sticks nach links oder rechts für das vorherige oder nächste Element; halten, um weiterzublättern. Sie können auch ein Miniaturbild im Filmstreifen auswählen."
      browseHint: "Videos in einer Galerie sind ebenfalls Elemente. Wenn Sie auf das Bedienfeld zeigen, scrollt der Stick das Bedienfeld."
      swipeTitle: "Zum Umblättern quer ziehen"
      swipeBody: "Zielen Sie auf das Bild, halten Sie den Zeigefinger-Auslöser und ziehen Sie nach links. Lassen Sie nach dem Umblätter-Signal los, um weiterzublättern; ziehen Sie nach rechts, um zurückzugehen. Kneifen und Ziehen funktioniert ebenfalls."
      swipeHint: "Bilder müssen bei 1× sein, um durch Ziehen umzublättern. Galerie-Videos unterstützen dies ebenfalls. Die Bühne bleibt stehen, bis Sie loslassen."
      zoomTitle: "In das Bild hineinzoomen"
      zoomBody: "Zielen Sie auf ein Detail im Bild, halten Sie den Zeigefinger-Auslöser und schieben Sie dann den Stick nach oben, um hineinzuzoomen, oder nach unten, um herauszuzoomen. Der Zoom ist dort verankert, wo Sie gedrückt haben."
      zoomHint: "Dadurch wird das Bild innerhalb seines Fensters vergrößert. Ohne Halten des Bildes passt Auf/Ab den Betrachtungsabstand an."
      panTitle: "Das Bild verschieben und wiederherstellen"
      panBody: "Sobald Sie hineingezoomt haben, halten Sie den Zeigefinger-Auslöser und ziehen Sie, um sich umzusehen. Doppeltippen Sie auf das Bild, um auf 2,5× zu zoomen oder es wiederherzustellen. Mit Händen zweimal schnell kneifen."
      panHint: "Durch Ziehen wird ein gezoomtes Bild verschoben. Stellen Sie vor dem Ziehen zum Umblättern auf 1× zurück."
      slideshowTitle: "Eine Diashow starten"
      slideshowBody: "Bei einem Bild startet oder pausiert A / X die Diashow. Das Bedienfeld bietet Intervalle von 3, 5, 10 oder 20 Sekunden sowie Standard- oder Original-Bildqualität."
      slideshowHint: "Bei einem Galerie-Video steuert A / X die Wiedergabe dieses Videos. Das Controller-Tastenkürzel muss in den Einstellungen aktiviert sein."
      moveTitle: "Den Bildschirm greifen und bewegen"
      moveBody: "Halten Sie die Greiftaste am inneren Griff, bewegen Sie den Controller, um den Bildschirm zu positionieren, und lassen Sie dann los. Beim Zuschauen können Sie den Bildschirm greifen, ohne darauf zu zeigen."
      moveHint: "Wenn Sie auf das App-Fenster oder das Bedienfeld zeigen, wird zuerst dieses Fenster gegriffen. Bei Panoramavideos passt das Greifen die Ausrichtung an."
      scaleTitle: "Mit beiden Händen skalieren"
      scaleBody: "Halten Sie beide Greiftasten. Spreizen Sie die Hände, um den Bildschirm zu vergrößern, oder führen Sie sie zusammen, um ihn zu verkleinern. Bei der Handverfolgung halten Sie mit beiden Händen ein Kneifen."
      scaleHint: "Für flache oder gewölbte Bildschirme, einschließlich der Galerie-Bühne. Halten Sie die Strahlen vom Bedienfeld fern. Dadurch wird der gesamte Bildschirm skaliert."
      distanceTitle: "Betrachtungsabstand anpassen"
      distanceBody: "Schieben Sie den Stick nach oben, um den Bildschirm zu entfernen, oder nach unten, um ihn näher zu bringen. Während Sie ein Fenster greifen, bewegt Auf/Ab dieses Fenster. Die Lautstärke stellen Sie im Bedienfeld ein."
      distanceHint: "Zeigen Sie weg vom Bedienfeld. Beim Halten eines Bildes wird Auf/Ab zur Bildvergrößerung; Panoramavideos passen stattdessen die Ansicht an."
      resizeTitle: "Ränder und Ecken verwenden"
      resizeBody: "Der Rahmen leuchtet auf, wenn sich Ihr Strahl einem Rand nähert. Halten Sie den Auslöser oder kneifen Sie an einem Rand, um das Fenster zu verschieben; ziehen Sie an einer Ecke, um die Größe zu ändern."
      resizeHint: "Funktioniert am App-Fenster, am Bedienfeld und am Bildschirm. Das App-Fenster ändert Breite und Höhe; Bildschirme behalten ihr Seitenverhältnis."
      navigationTitle: "Zurückgehen und Einstellungen öffnen"
      navigationBody: "B / Y geht eine Ebene zurück: ein Popup schließen oder zum Start des Bedienfelds zurückkehren, das Bedienfeld ausblenden und dann zur App zurückkehren. Die linke Menü-Taste öffnet die räumlichen Einstellungen."
      navigationHint: "Die rechte Meta-Taste gehört zum System. Das System-Recenter bringt die Ansicht wieder nach vorne, wobei Bildschirmgröße und -abstand erhalten bleiben."
      handsTitle: "Hände verwenden"
      handsBody: "Wenn die Handverfolgung aktiviert ist, richten Sie den Systemstrahl auf eine Schaltfläche, kneifen Sie Daumen und Zeigefinger zusammen und lassen Sie dann los. Verwenden Sie das Bedienfeld für Wiedergabe, Spulen und Galerie-Navigation."
      handsHint: "Kneifen Sie außerhalb, um das Bedienfeld umzuschalten. Kneifen Sie an einem Rand, um es zu verschieben, an einer Ecke, um die Größe zu ändern, oder mit beiden Händen und spreizen Sie, um den Bildschirm zu vergrößern."
